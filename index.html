<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>같이 뛰자 — 미현 & 현주</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #FAFAFA;
  --card: #FFFFFF;
  --text: #1A1A1A;
  --sub: #6B6B6B;
  --muted: #B5B5B5;
  --line: #ECECEC;
  --line-strong: #DDD;
  --mh: #A8C8E8;
  --mh-strong: #7FA8D2;
  --mh-bg: #EDF4FB;
  --mh-text: #2d4d6e;
  --hj: #F4A8B4;
  --hj-strong: #E8869B;
  --hj-bg: #FDF1F4;
  --hj-text: #6b3942;
  --accent: #111111;
  --gold: #F2C94C;
  --gold-bg: #FFF8E1;
  --gold-text: #6b5a00;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 28px 20px 120px; }

header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
header h1 { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -0.6px; }
header .sub { color: var(--sub); font-size: 12px; margin-top: 4px; }

button { font-family: inherit; cursor: pointer; }
.btn { background: var(--accent); color: #fff; border: 0; padding: 11px 20px; border-radius: 100px; font-weight: 700; font-size: 13px; }
.btn:hover { opacity: .9; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 8px 14px; border-radius: 100px; font-weight: 500; font-size: 12px; }
.btn-ghost:hover { background: #F2F2F2; }
.btn-ghost.active { background: var(--accent); color: #fff; border-color: var(--accent); }

section { margin-bottom: 32px; }
.section-title { font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
.section-emoji { margin-right: 4px; }

.card { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }

/* ===== User goal cards ===== */
.users-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.user-card { padding: 22px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card); position: relative; min-height: 160px; }
.user-card.mh { background: var(--mh-bg); border-color: #fadfe5; }
.user-card.hj { background: var(--hj-bg); border-color: #d6e6f5; }
.user-card .name { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.user-card .dot { width: 8px; height: 8px; border-radius: 50%; }
.user-card .dot.mh { background: var(--mh-strong); }
.user-card .dot.hj { background: var(--hj-strong); }
.user-card .goal-label { color: var(--sub); font-size: 12px; margin-top: 10px; }
.user-card .progress-num { font-size: 28px; font-weight: 800; margin-top: 14px; letter-spacing: -.5px; }
.user-card .progress-num small { font-size: 12px; font-weight: 500; color: var(--sub); margin-left: 4px; }
.progress-bar { height: 6px; background: rgba(0,0,0,0.06); border-radius: 100px; overflow: hidden; margin-top: 10px; }
.progress-bar .fill { height: 100%; transition: width .5s cubic-bezier(.4,0,.2,1); border-radius: 100px; }
.progress-bar .fill.mh { background: var(--mh-strong); }
.progress-bar .fill.hj { background: var(--hj-strong); }
.user-card .edit { position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,0.7); border: 0; border-radius: 100px; padding: 5px 11px; font-size: 11px; color: var(--sub); cursor: pointer; }
.user-card .edit:hover { background: #fff; color: var(--text); }
.user-card .streak { display: flex; gap: 10px; margin-top: 12px; font-size: 11px; flex-wrap: wrap; }
.user-card .streak .chip { background: rgba(255,255,255,0.65); padding: 4px 10px; border-radius: 100px; }

/* ===== Combined stats ===== */
.combined-card { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: center; }
.total-num { font-size: 44px; font-weight: 800; letter-spacing: -1.8px; line-height: 1; }
.total-num small { font-size: 14px; font-weight: 500; color: var(--sub); margin-left: 2px; }
.contribution-bar { height: 30px; border-radius: 100px; overflow: hidden; display: flex; margin-top: 14px; background: #F2F2F2; }
.contribution-bar > div { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; transition: width .5s ease; min-width: 0; }
.contribution-bar .mh-fill { background: var(--mh); color: var(--mh-text); }
.contribution-bar .hj-fill { background: var(--hj); color: var(--hj-text); }
.fun-msg { background: var(--gold-bg); border-radius: var(--radius-sm); padding: 16px; font-size: 13px; line-height: 1.55; color: var(--gold-text); border: 1px solid #FCE9A8; }
.together-stat { display: inline-block; margin-top: 10px; font-size: 12px; color: var(--sub); }
.together-stat strong { color: var(--text); font-weight: 700; }

/* ===== Trip / Journey ===== */
.trip-card { background: linear-gradient(135deg, #FFF8E1 0%, #F0F7FF 50%, #FDF1F4 100%); border: 1px solid var(--line); padding-top: 50px; }
.trip-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
.trip-now { display: flex; align-items: center; gap: 14px; }
.trip-emoji { font-size: 38px; line-height: 1; }
.trip-current-name { font-size: 18px; font-weight: 800; }
.trip-current-detail { font-size: 12px; color: var(--sub); margin-top: 2px; }
.trip-pct-big { font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
.trip-pct-big small { font-size: 11px; color: var(--sub); font-weight: 500; }
.trip-track { position: relative; height: 8px; background: rgba(0,0,0,0.08); border-radius: 100px; overflow: hidden; margin: 18px 0; }
.trip-track-fill { height: 100%; background: linear-gradient(90deg, var(--mh-strong), var(--hj-strong)); border-radius: 100px; transition: width .8s cubic-bezier(.4,0,.2,1); }
.trip-cities { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.trip-city { padding: 5px 10px; border-radius: 100px; background: rgba(255,255,255,0.6); color: var(--sub); border: 1px solid transparent; white-space: nowrap; }
.trip-city.visited { background: rgba(255,255,255,0.9); color: var(--text); }
.trip-city.current { background: var(--accent); color: #fff; font-weight: 700; }
.trip-city.upcoming { color: var(--muted); border-color: var(--line); background: transparent; }
.trip-next { font-size: 12px; color: var(--sub); margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.06); }
.trip-next strong { color: var(--text); font-weight: 700; }
.trip-cities-wrap { padding-top: 4px; }

/* ===== Activity (calendar + heatmap side-by-side) ===== */
.activity-row { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: stretch; }
.activity-row > .card { display: flex; flex-direction: column; }
@media (max-width: 760px) { .activity-row { grid-template-columns: 1fr; } }
/* Two equal columns (trip + food) — equalize card heights */
.two-col-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
.two-col-row > div { display: flex; flex-direction: column; min-width: 0; }
.two-col-row > div > .section-title { margin-bottom: 12px; }
.two-col-row > div > .card { flex: 1; display: flex; flex-direction: column; }
@media (max-width: 760px) { .two-col-row { grid-template-columns: 1fr; } }

/* ===== Activity chart ===== */
.chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; flex-wrap: wrap; }
.chart-title { font-size: 12px; font-weight: 700; color: var(--sub); }
.act-chart { display: flex; gap: 4px; align-items: flex-end; height: 200px; padding: 0 4px; }
.act-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.act-bar-stack { width: 100%; display: flex; flex-direction: column; justify-content: flex-end; height: 160px; gap: 2px; }
.act-bar-fill { width: 100%; border-radius: 3px 3px 0 0; min-height: 0; transition: height .35s ease; }
.act-bar-fill.mh { background: var(--mh); }
.act-bar-fill.hj { background: var(--hj); }
.act-bar-fill.zero { background: rgba(0,0,0,0.04); border-radius: 3px; min-height: 3px; }
.act-bar-label { font-size: 9px; color: var(--muted); text-align: center; font-weight: 700; line-height: 1.2; min-height: 11px; }
.act-bar-total { font-size: 9px; color: var(--text); font-weight: 800; }
.act-bar.narrow .act-bar-total { display: none; }
.chart-legend { display: flex; gap: 14px; justify-content: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 11px; color: var(--sub); }
.chart-legend .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 4px; vertical-align: middle; }
.chart-legend .sw.mh { background: var(--mh); }
.chart-legend .sw.hj { background: var(--hj); }
.act-stats { display: flex; gap: 16px; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.act-stats .stat { font-size: 12px; color: var(--sub); }
.act-stats .stat strong { color: var(--text); font-size: 16px; font-weight: 800; display: block; }

/* ===== PR Board (compact) ===== */
.pr-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
@media (max-width: 768px) { .pr-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; } }
@media (max-width: 600px) { .pr-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; } }
.pr-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 10px; position: relative; overflow: hidden; }
.pr-card .pr-label { font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: .6px; text-transform: uppercase; line-height: 1.2; padding-right: 22px; }
.pr-card .pr-emoji { position: absolute; top: 10px; right: 10px; font-size: 16px; opacity: .8; }
.pr-card .pr-value { font-size: 17px; font-weight: 800; margin-top: 4px; letter-spacing: -.4px; line-height: 1.1; }
.pr-card .pr-value small { font-size: 10px; color: var(--sub); font-weight: 500; }
.pr-card .pr-holder { font-size: 10px; color: var(--sub); margin-top: 4px; }
.pr-card .pr-holder b { font-weight: 700; }
.pr-card .pr-holder b.mh { color: var(--mh-text); }
.pr-card .pr-holder b.hj { color: var(--hj-text); }

/* ===== Badges (compact) ===== */
.badge-section { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.badge-block h4 { font-size: 12px; font-weight: 700; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
.badge-block h4 .dot { width: 7px; height: 7px; border-radius: 50%; }
.badge-block h4 .dot.mh { background: var(--mh-strong); }
.badge-block h4 .dot.hj { background: var(--hj-strong); }
.badge-block .got-count { color: var(--muted); font-size: 10px; font-weight: 500; margin-left: auto; }
.badges-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.badge { aspect-ratio: 1; border-radius: 12px; background: #F5F5F5; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 6px; text-align: center; position: relative; cursor: help; }
.badge.unlocked { background: linear-gradient(135deg, #FFF8E1 0%, #FCE9A8 100%); }
.badge.locked { opacity: .35; filter: grayscale(.7); }
.badge .b-emoji { font-size: 24px; line-height: 1; }
.badge .b-name { font-size: 11px; color: var(--sub); font-weight: 700; margin-top: 4px; line-height: 1.2; }
.badge.unlocked .b-name { color: var(--gold-text); }
@media (max-width: 720px) { .badge-section { grid-template-columns: 1fr; } .badges-grid { grid-template-columns: repeat(6, 1fr); gap: 4px; } }
@media (max-width: 600px) { .badges-grid { grid-template-columns: repeat(5, 1fr); gap: 3px; } .badge { padding: 6px 4px; } .badge .b-emoji { font-size: 20px; } .badge .b-name { font-size: 10px; margin-top: 3px; } }

/* ===== Calendar (compact) ===== */
.cal-card { padding: 16px; }
.calendar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px; }
.cal-nav { display: flex; align-items: center; gap: 4px; }
.cal-nav button { background: transparent; border: 1px solid var(--line); border-radius: 100px; width: 24px; height: 24px; font-size: 12px; padding: 0; line-height: 1; }
.cal-nav button:hover { background: #F2F2F2; }
.cal-month { font-size: 12px; font-weight: 700; min-width: 78px; text-align: center; }
.user-toggle { display: flex; gap: 2px; background: #F2F2F2; padding: 2px; border-radius: 100px; }
.user-toggle button { background: transparent; border: 0; padding: 4px 8px; border-radius: 100px; font-size: 10px; color: var(--sub); cursor: pointer; }
.user-toggle button.active { background: #fff; color: var(--text); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-day { aspect-ratio: 1; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--sub); position: relative; background: #FAFAFA; padding: 2px 0; }
.cal-day.empty { background: transparent; }
.cal-day.today { border: 1.5px solid var(--accent); font-weight: 800; color: var(--text); background: #fff; }
.cal-day.both { background: linear-gradient(135deg, var(--mh-bg) 50%, var(--hj-bg) 50%); }
.cal-day.mh-only { background: var(--mh-bg); }
.cal-day.hj-only { background: var(--hj-bg); }
.cal-day .num { font-size: 10px; line-height: 1; }
.cal-day .dots { display: flex; gap: 2px; margin-top: 2px; min-height: 4px; }
.cal-day .dots span { width: 4px; height: 4px; border-radius: 50%; }
.cal-day .dots .mh { background: var(--mh-strong); }
.cal-day .dots .hj { background: var(--hj-strong); }
.cal-weekday { font-size: 9px; color: var(--muted); text-align: center; padding: 2px 0; font-weight: 700; }
.cal-summary { display: flex; flex-direction: column; gap: 4px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11px; color: var(--sub); }
.cal-summary strong { color: var(--text); font-weight: 700; }

/* ===== Food total (compact) ===== */
.food-card { background: linear-gradient(135deg, #FFF8E1 0%, #FFF3D6 100%); border: 1px solid #FCE9A8; padding: 18px; padding-top: 50px; }
.food-total-num { font-size: 22px; font-weight: 800; color: var(--gold-text); letter-spacing: -.5px; }
.food-total-num small { font-size: 11px; color: #8a7400; font-weight: 500; margin-left: 3px; }
.food-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 12px;
}

/* 개별 아이템 (카드 형태) */
.food-grid-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: rgba(255, 255, 255, 0.4);
  padding: 10px 5px;
  border-radius: 12px;
}

.food-line-item { display: flex; align-items: center; justify-content: center; gap: 4px; background: rgba(255, 255, 255, 0.6); padding: 8px 10px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.05); }
.f-emoji { font-size: 1rem; flex-shrink: 0; }
.f-name { font-size: 10px; color: #666; font-weight: 500; flex-shrink: 0; }
.f-count { font-weight: 700; font-size: 1.1rem; color: #333; flex-shrink: 0; }
.f-unit { font-size: 9px; color: #999; font-weight: 500; flex-shrink: 0; }
.food-item { background: rgba(255,255,255,0.7); border-radius: 10px; padding: 10px 8px; text-align: center; }
.food-item .f-emoji { font-size: 24px; line-height: 1.1; }
.food-item .f-count { font-size: 16px; font-weight: 800; color: var(--text); margin-top: 4px; }
.food-item .f-name { font-size: 11px; color: var(--sub); margin-top: 2px; line-height: 1.3; }

/* ===== Feed list ===== */
.feed-item { display: flex; gap: 14px; padding: 18px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); margin-bottom: 10px; align-items: center; }
.feed-item.compact { display: flex; gap: 12px; padding: 12px 14px; margin-bottom: 6px; align-items: center; justify-content: space-between; min-height: auto; }
.feed-item .left { flex-shrink: 0; }
.feed-item .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #fff; }
.feed-item .avatar.mh { background: var(--mh-strong); }
.feed-item .avatar.hj { background: var(--hj-strong); }
.feed-item.compact .avatar { width: 32px; height: 32px; font-size: 12px; }
.feed-item .body { flex: 1; min-width: 0; }
.feed-item.compact .body { display: flex; gap: 10px; align-items: center; flex: 1; flex-wrap: wrap; }
.feed-item .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.feed-item.compact .meta { display: flex; gap: 10px; align-items: center; }
.feed-item .name { font-weight: 800; font-size: 14px; }
.feed-item.compact .name { font-size: 12px; white-space: nowrap; }
.feed-item .date { color: var(--muted); font-size: 12px; flex: 1; }
.feed-item.compact .date { font-size: 11px; color: var(--muted); white-space: nowrap; }
.feed-item.compact .memo-text { font-size: 11px; color: var(--muted); }
.feed-item.compact .food-badge { background: var(--gold-bg); padding: 4px 10px; border-radius: 100px; font-size: 11px; color: var(--gold-text); border: 1px solid #FCE9A8; white-space: nowrap; }
.feed-item .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
.feed-item.compact .stats { display: flex; gap: 8px; margin-top: 0; font-size: 11px; }
.feed-item.compact .stat { font-size: 11px; }
.feed-item.compact .stat strong { font-size: 13px; }
.feed-item .stat { font-size: 12px; }
.feed-item .stat strong { font-size: 15px; font-weight: 800; }
.feed-item .stat label { color: var(--muted); display: block; font-size: 10px; margin-bottom: 2px; font-weight: 600; }
.feed-item.compact .stat label { display: none; }
.feed-item .memo { color: var(--sub); font-size: 13px; margin-top: 12px; line-height: 1.55; white-space: pre-wrap; padding: 10px 12px; background: #FAFAFA; border-radius: var(--radius-sm); }
.feed-item .photo { margin-top: 10px; }
.feed-item .photo img { max-width: 100%; max-height: 320px; border-radius: var(--radius-sm); display: block; cursor: pointer; }
.feed-item .food { display: inline-block; margin-top: 10px; background: var(--gold-bg); padding: 6px 12px; border-radius: 100px; font-size: 12px; color: var(--gold-text); border: 1px solid #FCE9A8; }
.feed-item .actions { display: flex; gap: 6px; }
.feed-item.compact .actions { display: flex; gap: 4px; }
.feed-item .delete { background: transparent; border: 0; color: var(--muted); font-size: 11px; cursor: pointer; padding: 2px 6px; }
.feed-item.compact .delete { padding: 4px 8px; background: #FFE4E4; color: #B84040; border-radius: 4px; font-size: 10px; }
.feed-item.compact .delete:hover { background: #FFD1D1; }
.feed-item .edit { background: transparent; border: 0; color: var(--muted); font-size: 11px; cursor: pointer; padding: 2px 6px; }
.feed-item.compact .edit { padding: 4px 8px; background: var(--line); color: var(--text); border-radius: 4px; font-size: 10px; }
.feed-item.compact .edit:hover { background: var(--line-strong); }
.feed-item .delete:hover { color: #d33; }

/* ===== Feed expand/collapse ===== */
.feed-toggle-btn { background: transparent; border: 1px solid var(--line); border-radius: 100px; padding: 8px 16px; font-size: 12px; font-weight: 700; color: var(--text); cursor: pointer; margin-top: 16px; transition: all .2s; }
.feed-toggle-btn:hover { background: #F2F2F2; }

/* ===== Floating add button ===== */
.fab { position: fixed; right: 24px; bottom: 24px; background: var(--accent); color: #fff; border: 0; width: 58px; height: 58px; border-radius: 50%; font-size: 30px; box-shadow: 0 6px 20px rgba(0,0,0,0.22); cursor: pointer; line-height: 0; padding-bottom: 4px; z-index: 50; }
.fab:hover { transform: translateY(-2px); transition: transform .2s; }

/* ===== Modal ===== */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
.modal-bg.show { display: flex; }
.modal { background: #fff; border-radius: 20px 20px 0 0; padding: 24px 22px 30px; max-width: 480px; width: 100%; max-height: 92vh; overflow-y: auto; }
@media (min-width: 600px) { .modal-bg { align-items: center; } .modal { border-radius: var(--radius); } }
.modal h3 { margin: 0 0 18px; font-size: 16px; font-weight: 800; }
.modal .field { margin-bottom: 14px; }

function setScope(scope) {
  viewScope = scope;
  document.querySelectorAll('.scope-tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.scope === scope);
  });
  // Sync calendar filter to scope
  if (scope === 'all') calFilter = 'all';
  else { const u = getUserByName(scope); if (u) calFilter = String(u.user_id); }
  // Update dynamic titles
  updateScopedTitles();
  renderAll();
}

function updateScopedTitles() {
  const tripT = $('tripTitle');
  const foodT = $('foodTitle');
  const prT = $('prTitle');
  if (viewScope === 'all') {
    if (tripT) tripT.innerHTML = '<span class="section-emoji">🗺️</span>우리의 여행';
    if (foodT) foodT.innerHTML = '<span class="section-emoji">🍗</span>우리가 태운 음식';
    if (prT)   prT.innerHTML   = '<span class="section-emoji">🏆</span>우리의 최고 기록';
  } else {
    const n = viewScope;
    if (tripT) tripT.innerHTML = `<span class="section-emoji">🗺️</span>${n}의 여행`;
    if (foodT) foodT.innerHTML = `<span class="section-emoji">🍗</span>${n}이 태운 음식`;
    if (prT)   prT.innerHTML   = `<span class="section-emoji">🏆</span>${n}의 최고 기록`;
  }
}

function scopedLogs() {
  if (viewScope === 'all') return logs;
  return logs.filter(l => {
    const u = getUserById(l.user_id);
    return u && u.user_name === viewScope;
  });
}
function scopedNames() {
  return viewScope === 'all' ? NAMES : [viewScope];

const $ = (id) => document.getElementById(id);
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); }
function fmtDate(d) { if (typeof d === 'string') d = new Date(d + 'T00:00'); return `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}.`; }
function userClass(name) { return name === '현주' ? 'hj' : 'mh'; }
function paceFromSec(sec, km) { if (!km || !sec) return '-'; const sp = sec / km; const m = Math.floor(sp/60); const s = Math.round(sp%60); return `${m}'${String(s).padStart(2,'0')}"`; }
function fmtDuration(sec) { sec = Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60; if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; return `${m}:${String(s).padStart(2,'0')}`; }
function getWeight(name) { const w = localStorage.getItem('weight_' + name); return w ? parseFloat(w) : 60; }
function setWeight(name, v) { localStorage.setItem('weight_' + name, v); }
function calcKcal(km, name) { return Math.round(km * getWeight(name) * 1.036); }
function escapeHtml(s) { return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function dateKey(d) { const dt = (typeof d==='string') ? new Date(d+'T00:00') : d; return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function daysBetween(a, b) { return Math.round((new Date(dateKey(b)) - new Date(dateKey(a))) / 86400000); }

function defaultMissionIndex() {
  const k = dateKey(new Date());
  let h = 0;
  for (let i = 0; i < k.length; i++) h = ((h << 5) - h + k.charCodeAt(i)) | 0;
  return Math.abs(h) % missions.length;
}

function getCurrentMissionIndex() {
  const k = dateKey(new Date());
  const stored = localStorage.getItem('mission_pick_' + k);
  if (stored !== null && !isNaN(parseInt(stored))) return parseInt(stored);
  return defaultMissionIndex();
}

function todayLogsByName(name) {
  const tk = dateKey(new Date());
  return userLogs(name).filter(l => l.run_date === tk);
}

let isSpinning = false;

function renderMission() {
  const idx = getCurrentMissionIndex();
  const m = missions[idx];
  const names = scopedNames();
  const checks = names.map(n => {
    const done = m.c(todayLogsByName(n), null, n);
    return `<div class="m-check ${done?'done':''}"><span class="nd ${done?'':userClass(n)}"></span>${n}</div>`;
  }).join('');
  const allDone = names.every(n => m.c(todayLogsByName(n), null, n));
  const celebrate = (names.length > 1 && allDone) ? '<div class="m-celebrate">🎉 둘 다 클리어!</div>' : '';
  $('missionCard').innerHTML = `
    <div class="m-emoji" id="mEmoji">${m.e}</div>
    <div class="m-body">
      <div class="m-label">🎲 오늘의 랜덤 미션</div>
      <div class="m-text" id="mText">${m.t}</div>
      <div class="m-checks">${checks}${celebrate}</div>
    </div>
    <button class="m-spin" id="mSpinBtn" onclick="spinMission()" title="다른 미션으로 돌리기">🎰</button>
  `;
}

function spinMission() {
  if (isSpinning) return;
  isSpinning = true;
  const btn = $('mSpinBtn');
  if (btn) btn.classList.add('spinning');
  const emojiEl = $('mEmoji');
  const textEl = $('mText');
  if (emojiEl) emojiEl.classList.add('shuffling');
  if (textEl) textEl.classList.add('shuffling');

  // Pick final index now (excluding current to guarantee a change)
  const currentIdx = getCurrentMissionIndex();
  let finalIdx = Math.floor(Math.random() * missions.length);
  if (missions.length > 1) {
    while (finalIdx === currentIdx) finalIdx = Math.floor(Math.random() * missions.length);
  }

  let elapsed = 0;
  let interval = 50;
  const totalMs = 1700;
  let lastShownIdx = -1;
  function tick() {
    elapsed += interval;
    if (elapsed >= totalMs) {
      // Land on final
      localStorage.setItem('mission_pick_' + dateKey(new Date()), String(finalIdx));
      isSpinning = false;
      renderMission();
      return;
    }
    let r = Math.floor(Math.random() * missions.length);
    if (r === lastShownIdx && missions.length > 1) r = (r + 1) % missions.length;
    lastShownIdx = r;
    const mm = missions[r];
    if (emojiEl) emojiEl.textContent = mm.e;
    if (textEl) textEl.textContent = mm.t;
    interval = Math.min(220, interval * 1.18);
    setTimeout(tick, interval);
  }
  tick();
}

async function loadAll() {
  try {
    const { data: u, error: ue } = await sb.from('run_user').select('*');
    if (ue) throw new Error('run_user 읽기 실패: ' + ue.message);
    users = u || [];
    if (users.length < 2) {
      showHelp(`두 명의 러너가 필요해요 (현재 ${users.length}명). Supabase SQL Editor에서:<br><br><code>INSERT INTO run_user (user_name) VALUES ('미현'), ('현주');</code>`);
    }
    const y = today.getFullYear(), m = today.getMonth() + 1;
    const { data: g } = await sb.from('run_goal').select('*').eq('goal_year', y).eq('goal_month', m);
    goals = g || [];
    const { data: l } = await sb.from('run_log').select('*').order('run_date', { ascending: false }).limit(500);
    logs = l || [];
  } catch (e) {
    showHelp('데이터를 불러오지 못했어요: ' + e.message + '<br>Supabase RLS 정책에서 anon에게 SELECT 권한이 있는지 확인해 주세요.');
    return;
  }
  renderAll();
}

// ============== Compute helpers ==============
function getUserByName(n) { return users.find(u => u.user_name === n); }
function getUserById(id) { return users.find(u => String(u.user_id) === String(id)); }
function userLogs(name) { const u = getUserByName(name); if (!u) return []; return logs.filter(l => String(l.user_id) === String(u.user_id)); }

function getFilteredLogs(filterType) {
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth() + 1;
  let base = logs;
  if (viewScope !== 'all') {
    base = base.filter(l => { const u = getUserById(l.user_id); return u && u.user_name === viewScope; });
  }
  if (filterType === 'month') {
    return base.filter(l => {
      const d = new Date(l.run_date + 'T00:00');
      return d.getFullYear() === currentYear && d.getMonth() + 1 === currentMonth;
    });
  }
  return base; // 'all'
}

function userTotalKm(name) { return userLogs(name).reduce((s,l) => s + parseFloat(l.distance||0), 0); }
function userBestPace(name) {
  let best = null;
  for (const l of userLogs(name)) {
    const km = parseFloat(l.distance||0); const sec = parseInt(l.duration_seconds||0);
    if (km >= 1 && sec > 0) { const p = sec/km; if (best === null || p < best) best = p; }
  }
  return best;
}
function userLongestRun(name) { let max = 0, bestLog = null; for (const l of userLogs(name)) { const km = parseFloat(l.distance||0); if (km > max) { max = km; bestLog = l; } } return { km: max, log: bestLog }; }
function userLongestDuration(name) { let max = 0; for (const l of userLogs(name)) { const s = parseInt(l.duration_seconds||0); if (s > max) max = s; } return max; }
function userMaxStreak(name) {
  const dates = [...new Set(userLogs(name).map(l => l.run_date))].sort();
  let max = 0, cur = 0, prev = null;
  for (const d of dates) { if (prev && daysBetween(prev, d) === 1) cur++; else cur = 1; if (cur > max) max = cur; prev = d; }
  return max;
}
function userCurrentStreak(name) {
  const dates = [...new Set(userLogs(name).map(l => l.run_date))].sort().reverse();
  if (!dates.length) return 0;
  const todayKey = dateKey(new Date()); const yKey = dateKey(new Date(Date.now() - 86400000));
  if (dates[0] !== todayKey && dates[0] !== yKey) return 0;
  let cur = 1, prev = dates[0];
  for (let i = 1; i < dates.length; i++) { if (daysBetween(dates[i], prev) === 1) { cur++; prev = dates[i]; } else break; }
  return cur;
}
function userMaxWeeklyKm(name) {
  const weekly = {};
  for (const l of userLogs(name)) {
    const d = new Date(l.run_date + 'T00:00');
    const day = d.getDay() === 0 ? 7 : d.getDay();
    const mon = new Date(d); mon.setDate(d.getDate() - day + 1);
    const k = dateKey(mon);
    weekly[k] = (weekly[k] || 0) + parseFloat(l.distance||0);
  }
  return Math.max(0, ...Object.values(weekly));
}
function userMaxMonthKm(name) {
  const m = {};
  for (const l of userLogs(name)) {
    const d = new Date(l.run_date + 'T00:00');
    const k = `${d.getFullYear()}-${d.getMonth()+1}`;
    m[k] = (m[k] || 0) + parseFloat(l.distance||0);
  }
  return Math.max(0, ...Object.values(m));
}
function userLastRunDate(name) {
  const ds = userLogs(name).map(l => l.run_date).sort();
  return ds.length ? ds[ds.length - 1] : null;
}

function renderUserCards() {
  const namesToShow = scopedNames();
  const el = $('userCards');
  if (el) el.style.gridTemplateColumns = namesToShow.length === 1 ? '1fr' : '1fr 1fr';
  const html = namesToShow.map(name => {
    const u = getUserByName(name);
    if (!u) return `<div class="user-card"><div class="name"><span class="dot ${userClass(name)}"></span>${name}</div><div class="goal-label">아직 등록되지 않았어요</div></div>`;
    const goal = goals.find(g => String(g.user_id) === String(u.user_id));
    let progress = 0, target = 0, label = '목표 미설정';
    if (goal) {
      target = parseFloat(goal.target_value);
      if (goal.goal_type === 'MONTHLY_DISTANCE') {
        const km = userLogs(name).filter(x => { const d = new Date(x.run_date+'T00:00'); return d.getFullYear()===today.getFullYear() && d.getMonth()+1===today.getMonth()+1; }).reduce((s,x) => s+parseFloat(x.distance||0), 0);
        progress = km;
        label = `이번 달 <strong>${km.toFixed(1)} / ${target}</strong> km`;
      } else if (goal.goal_type === 'WEEKLY_COUNT') {
        // 이번 달 전체 진행도 (주*4)
        const monthlyTarget = target * 4;
        const monthlyCnt = new Set(userLogs(name).filter(x => { const d = new Date(x.run_date+'T00:00'); return d.getFullYear()===today.getFullYear() && d.getMonth()+1===today.getMonth()+1; }).map(x => x.run_date)).size;

        progress = monthlyCnt;
        target = monthlyTarget;
        label = `이번 달 <strong>${monthlyCnt} / ${monthlyTarget}</strong> 회`;
      }
    }
    const pct = target ? Math.min(100, (progress / target) * 100) : 0;
    const streak = userCurrentStreak(name);
    const lastDate = userLastRunDate(name);
    const lastDays = lastDate ? daysBetween(lastDate, dateKey(new Date())) : null;
    let lastTxt = '아직 기록 없음';
    if (lastDays === 0) lastTxt = '오늘도 뛰었어요!';
    else if (lastDays === 1) lastTxt = '어제 뛰었어요';
    else if (lastDays !== null) lastTxt = `${lastDays}일 전`;

    const streakChip = streak > 0 ? `<span class="chip">🔥 ${streak}일 연속</span>` : '';
    const lastChip = `<span class="chip">📅 ${lastTxt}</span>`;
    return `
      <div class="user-card ${userClass(name)}">
        <button class="edit" onclick="openGoal('${u.user_id}','${name}')">목표 ${goal ? '수정' : '설정'}</button>
        <div class="name"><span class="dot ${userClass(name)}"></span>${name}</div>
        <div class="goal-label">${label}</div>
        <div class="progress-num">${pct.toFixed(0)}<small>% 달성</small></div>
        <div class="progress-bar"><div class="fill ${userClass(name)}" style="width:${pct}%"></div></div>
        <div class="streak">${streakChip}${lastChip}</div>
      </div>`;
  }).join('');
  if (el) el.innerHTML = html;
}

function renderActivitySummary() {
  try {
    // 지난 7일 요약
    const sevenDaysAgo = new Date();
    sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

    const weeklyHtml = NAMES.map(name => {
      const weeklyLogs = userLogs(name).filter(l => new Date(l.run_date + 'T00:00') >= sevenDaysAgo);
      const weeklyKm = weeklyLogs.reduce((s, l) => s + parseFloat(l.distance || 0), 0);
      const weeklyDays = new Set(weeklyLogs.map(l => l.run_date)).size;
      return `
        <div class="stat-user">
          <span class="name">${name}</span>
          <span class="value">${weeklyKm.toFixed(1)}km · ${weeklyDays}일</span>
        </div>`;
    }).join('');
    const weeklySummaryEl = $('weeklySummary');
    if (weeklySummaryEl) weeklySummaryEl.innerHTML = weeklyHtml;

  // 이번 달 진행도
  const monthlyLogs = logs.filter(l => {
    const d = new Date(l.run_date + 'T00:00');
    return d.getFullYear() === today.getFullYear() && d.getMonth() + 1 === today.getMonth() + 1;
  });

  const monthlyByUser = {};
  NAMES.forEach(name => {
    const userMonthlyLogs = monthlyLogs.filter(l => {
      const u = getUserById(l.user_id);
      return u && u.user_name === name;
    });
    const monthlyKm = userMonthlyLogs.reduce((s, l) => s + parseFloat(l.distance || 0), 0);
    monthlyByUser[name] = monthlyKm;
  });

  const totalMonthly = Object.values(monthlyByUser).reduce((s, k) => s + k, 0);

  const monthlyHtml = NAMES.map(name => {
    const km = monthlyByUser[name];
    const pct = totalMonthly > 0 ? (km / totalMonthly) * 100 : 0;
    return `
      <div class="progress-item">
        <div class="label">
          <span class="name">${name}</span>
          <span class="percent">${km.toFixed(1)}km</span>
        </div>
        <div class="progress-bar-container">
          <div class="fill ${userClass(name)}" style="width:${pct}%"></div>
        </div>
      </div>`;
  }).join('');

  // 누적 거리 멘트 찾기
  let milestone = milestones[0];
  for (let i = milestones.length - 1; i >= 0; i--) {
    if (totalMonthly >= milestones[i].km) {
      milestone = milestones[i];
      break;
    }
  }

  // 누적 거리를 가운데에 표시
  const cumulativeKmEl = $('cumulativeKm');
  const cumulativeMsgEl = $('cumulativeMsg');
  if (cumulativeKmEl) cumulativeKmEl.textContent = totalMonthly.toFixed(1) + ' km';
  if (cumulativeMsgEl) cumulativeMsgEl.innerHTML = milestone.msg;

  const monthlySummaryEl = $('monthlySummary');
  if (monthlySummaryEl) monthlySummaryEl.innerHTML = monthlyHtml;
  } catch (e) {
    console.error('renderActivitySummary error:', e);
  }
}

function renderCombined() {
  try {
    const scoped = scopedLogs();
    const total = scoped.reduce((s, x) => s + parseFloat(x.distance || 0), 0);
    const totalKmEl = $('totalKm');
    if (totalKmEl) totalKmEl.textContent = total.toFixed(1);

    const funMsgEl = $('funMsg');
    if (funMsgEl) funMsgEl.textContent = getMilestone(total);

    const contribBarEl = $('contribBar');
    if (contribBarEl) {
      if (viewScope !== 'all') {
        // Single user — show single full bar
        const cls = userClass(viewScope);
        contribBarEl.innerHTML = total === 0
          ? '<div style="width:100%;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center">아직 기록이 없어요</div>'
          : `<div class="${cls}-fill" style="width:100%">${viewScope} ${total.toFixed(1)}km</div>`;
      } else {
        const mhKm = userTotalKm('미현'), hjKm = userTotalKm('현주');
        const sum = mhKm + hjKm;
        if (sum === 0) {
          contribBarEl.innerHTML = '<div style="width:100%;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center">아직 기록이 없어요</div>';
        } else {
          const mhPct = (mhKm / sum) * 100, hjPct = (hjKm / sum) * 100;
          contribBarEl.innerHTML = `
            <div class="mh-fill" style="width:${mhPct}%">${mhPct > 14 ? `미현 ${mhKm.toFixed(1)}km` : ''}</div>
            <div class="hj-fill" style="width:${hjPct}%">${hjPct > 14 ? `현주 ${hjKm.toFixed(1)}km` : ''}</div>`;
        }
      }
    }

    const togetherStatEl = $('togetherStat');
    if (togetherStatEl) {
      if (viewScope !== 'all') {
        const myDates = new Set(userLogs(viewScope).map(l => l.run_date));
        togetherStatEl.innerHTML = `🏃‍♀️ ${viewScope}이 뛴 날 <strong>${myDates.size}일</strong> · 누적 <strong>${total.toFixed(1)}km</strong>`;
      } else {
        const mhDates = new Set(userLogs('미현').map(l => l.run_date));
        const hjDates = new Set(userLogs('현주').map(l => l.run_date));
        let common = 0; for (const d of mhDates) if (hjDates.has(d)) common++;
        const totalDays = new Set([...mhDates, ...hjDates]).size;
        togetherStatEl.innerHTML = `🤝 함께 뛴 날 <strong>${common}일</strong> · 둘 중 한 명이라도 뛴 날 <strong>${totalDays}일</strong>`;
      }
    }
  } catch (e) {
    console.error('renderCombined error:', e);
  }
}

function renderTrip() {
  const cs = getCities();
  const filteredLogs = getFilteredLogs(tripFilter);
  const total = filteredLogs.reduce((s, x) => s + parseFloat(x.distance || 0), 0);
  // find current segment
  let seg = { from: cs[0], to: cs[1], pct: 0 };
  for (let i = 0; i < cs.length - 1; i++) {
    if (total >= cs[i].km && total < cs[i+1].km) {
      seg = { from: cs[i], to: cs[i+1], pct: (total - cs[i].km) / (cs[i+1].km - cs[i].km) };
      break;
    }
  }
  if (total >= cs[cs.length - 1].km) {
    seg = { from: cs[cs.length - 1], to: null, pct: 1 };
  }
  const fromIdx = cs.findIndex(c => c === seg.from);
  const start = Math.max(0, fromIdx - 2);
  const end = Math.min(cs.length, fromIdx + 4);
  const slice = cs.slice(start, end);
  const chips = slice.map((c, i) => {
    let cls = 'upcoming';
    if (i + start < fromIdx) cls = 'visited';
    else if (i + start === fromIdx) cls = 'visited';
    else if (i + start === fromIdx + 1) cls = 'current';
    return `<div class="trip-city ${cls}">${c.emoji} ${c.name}</div>`;
  }).join('');

  const distLeft = seg.to ? (seg.to.km - total).toFixed(0) : 0;
  const segPct = (seg.pct * 100).toFixed(0);
  const totalPctOfFinal = Math.min(100, (total / cs[cs.length-1].km) * 100);

  $('tripCard').innerHTML = `
    <div class="trip-header">
      <div class="trip-now">
        <div class="trip-emoji">${seg.from.emoji}</div>
        <div>
          <div class="trip-current-name">지금 ${seg.from.name} ${seg.to ? '근처' : '도착!'}</div>
          <div class="trip-current-detail">${total.toFixed(1)}km / ${cs[cs.length-1].km.toLocaleString()}km · 전체 ${totalPctOfFinal.toFixed(2)}%</div>
        </div>
      </div>
      <div class="trip-pct-big">${segPct}%<small> 다음 도시까지</small></div>
    </div>
    <div class="trip-track"><div class="trip-track-fill" style="width:${seg.pct*100}%"></div></div>
    <div class="trip-cities">${chips}</div>
    ${seg.to ? `<div class="trip-next">🎯 다음 목적지 <strong>${seg.to.emoji} ${seg.to.name}</strong>까지 <strong>${distLeft}km</strong> 남았어요</div>` : '<div class="trip-next">🏆 모든 도시 정복! 전설의 러너가 되었습니다</div>'}
  `;
}

function renderMonthChart() {
  const year = today.getFullYear();
  $('actChartLabel').textContent = `${year}년 월별 활동`;
  const months = [];
  for (let m = 1; m <= 12; m++) months.push({ label: m, mh: 0, hj: 0 });
  for (const l of scopedLogs()) {
    const d = new Date(l.run_date + 'T00:00');
    if (d.getFullYear() === year) {
      const u = getUserById(l.user_id);
      const km = parseFloat(l.distance||0);
      if (u && u.user_name === '미현') months[d.getMonth()].mh += km;
      if (u && u.user_name === '현주') months[d.getMonth()].hj += km;
    }
  }
  const max = Math.max(0.1, ...months.map(m => m.mh + m.hj));
  $('actChart').innerHTML = months.map(m => {
    const total = m.mh + m.hj;
    const totalH = total === 0 ? 0 : (total / max) * 100;
    const mhH = total === 0 ? 0 : (m.mh / total) * totalH;
    const hjH = total === 0 ? 0 : (m.hj / total) * totalH;
    if (total === 0) {
      return `<div class="act-bar"><div class="act-bar-stack"><div class="act-bar-fill zero"></div></div><div class="act-bar-total" style="color:var(--muted)">-</div><div class="act-bar-label">${m.label}월</div></div>`;
    }
    return `
      <div class="act-bar" title="${m.label}월: 미현 ${m.mh.toFixed(1)}km, 현주 ${m.hj.toFixed(1)}km">
        <div class="act-bar-stack">
          ${m.mh > 0 ? `<div class="act-bar-fill mh" style="height:${mhH}%"></div>` : ''}
          ${m.hj > 0 ? `<div class="act-bar-fill hj" style="height:${hjH}%"></div>` : ''}
        </div>
        <div class="act-bar-total">${total.toFixed(0)}</div>
        <div class="act-bar-label">${m.label}월</div>
      </div>`;
  }).join('');

  // Stats
  const totalKm = months.reduce((s, m) => s + m.mh + m.hj, 0);
  const bestMonth = months.reduce((b, m) => (m.mh + m.hj) > (b.mh + b.hj) ? m : b, months[0]);
  const activeMonths = months.filter(m => (m.mh + m.hj) > 0).length;
  $('actStats').innerHTML = `
    <div class="stat"><strong>${totalKm.toFixed(0)}km</strong>${year}년 누적</div>
    <div class="stat"><strong>${(bestMonth.mh + bestMonth.hj).toFixed(0)}km</strong>최다 ${bestMonth.label}월</div>
    <div class="stat"><strong>${activeMonths}달</strong>달린 달</div>
  `;
}

function renderDayChart() {
  const year = today.getFullYear();
  const month = today.getMonth() + 1;
  $('actChartLabel').textContent = `${year}년 ${month}월 일별 활동`;
  const daysInMonth = new Date(year, month, 0).getDate();
  const days = [];
  for (let i = 1; i <= daysInMonth; i++) {
    const d = new Date(year, month - 1, i);
    days.push({ date: dateKey(d), label: `${i}`, mh: 0, hj: 0 });
  }
  for (const l of scopedLogs()) {
    const day = days.find(x => x.date === l.run_date);
    if (day) {
      const u = getUserById(l.user_id);
      const km = parseFloat(l.distance||0);
      if (u && u.user_name === '미현') day.mh += km;
      if (u && u.user_name === '현주') day.hj += km;
    }
  }
  const max = Math.max(0.1, ...days.map(d => d.mh + d.hj));
  $('actChart').innerHTML = days.map((d, i) => {
    const total = d.mh + d.hj;
    const totalH = total === 0 ? 0 : (total / max) * 100;
    const mhH = total === 0 ? 0 : (d.mh / total) * totalH;
    const hjH = total === 0 ? 0 : (d.hj / total) * totalH;
    const showLabel = (i === 0 || i === daysInMonth - 1 || (i + 1) % 5 === 0) ? d.label : '';
    if (total === 0) {
      return `<div class="act-bar narrow"><div class="act-bar-stack"><div class="act-bar-fill zero"></div></div><div class="act-bar-label">${showLabel}</div></div>`;
    }
    return `
      <div class="act-bar narrow" title="${month}/${d.label}: 미현 ${d.mh.toFixed(1)}km, 현주 ${d.hj.toFixed(1)}km">
        <div class="act-bar-stack">
          ${d.mh > 0 ? `<div class="act-bar-fill mh" style="height:${mhH}%"></div>` : ''}
          ${d.hj > 0 ? `<div class="act-bar-fill hj" style="height:${hjH}%"></div>` : ''}
        </div>
        <div class="act-bar-label">${showLabel}</div>
      </div>`;
  }).join('');

  // Stats
  const totalKm = days.reduce((s, d) => s + d.mh + d.hj, 0);
  const ranDays = days.filter(d => (d.mh + d.hj) > 0).length;
  const bestDay = days.reduce((b, d) => (d.mh + d.hj) > (b.mh + b.hj) ? d : b, days[0]);
  $('actStats').innerHTML = `
    <div class="stat"><strong>${totalKm.toFixed(0)}km</strong>${month}월 누적</div>
    <div class="stat"><strong>${ranDays}일</strong>${daysInMonth}일 중 뛴 날</div>
    <div class="stat"><strong>${(bestDay.mh + bestDay.hj).toFixed(1)}km</strong>최장 (${month}/${bestDay.label})</div>
  `;
}

function renderPRBoard() {
  const items = [];
  const candidates = scopedNames();
  let longest = { km: 0, name: null };
  for (const n of candidates) { const r = userLongestRun(n); if (r.km > longest.km) longest = { km: r.km, name: n }; }
  items.push({ label: '최장 단일 거리', value: longest.km > 0 ? `${longest.km.toFixed(2)}<small> km</small>` : '-', holder: longest.name, emoji: '🏃‍♀️' });
  let bestPace = { sec: null, name: null };
  for (const n of candidates) { const p = userBestPace(n); if (p && (bestPace.sec === null || p < bestPace.sec)) bestPace = { sec: p, name: n }; }
  items.push({ label: '최단 평균 페이스', value: bestPace.sec ? `${Math.floor(bestPace.sec/60)}'${String(Math.round(bestPace.sec%60)).padStart(2,'0')}"<small>/km</small>` : '-', holder: bestPace.name, emoji: '💨' });
  let longestT = { sec: 0, name: null };
  for (const n of candidates) { const s = userLongestDuration(n); if (s > longestT.sec) longestT = { sec: s, name: n }; }
  items.push({ label: '최장 러닝 시간', value: longestT.sec > 0 ? fmtDuration(longestT.sec) : '-', holder: longestT.name, emoji: '⏱️' });
  let bestWeek = { km: 0, name: null };
  for (const n of candidates) { const k = userMaxWeeklyKm(n); if (k > bestWeek.km) bestWeek = { km: k, name: n }; }
  items.push({ label: '최다 주간 거리', value: bestWeek.km > 0 ? `${bestWeek.km.toFixed(1)}<small> km</small>` : '-', holder: bestWeek.name, emoji: '🔥' });
  let bestMonth = { km: 0, name: null };
  for (const n of candidates) { const k = userMaxMonthKm(n); if (k > bestMonth.km) bestMonth = { km: k, name: n }; }
  items.push({ label: '최다 월간 거리', value: bestMonth.km > 0 ? `${bestMonth.km.toFixed(1)}<small> km</small>` : '-', holder: bestMonth.name, emoji: '🏆' });
  let bestStreak = { d: 0, name: null };
  for (const n of candidates) { const s = userMaxStreak(n); if (s > bestStreak.d) bestStreak = { d: s, name: n }; }
  items.push({ label: '최장 연속 출석', value: bestStreak.d > 0 ? `${bestStreak.d}<small> 일</small>` : '-', holder: bestStreak.name, emoji: '🔁' });

  const showHolder = viewScope === 'all';
  $('prGrid').innerHTML = items.map(it => `
    <div class="pr-card">
      <div class="pr-emoji">${it.emoji}</div>
      <div class="pr-label">${it.label}</div>
      <div class="pr-value">${it.value}</div>
      ${showHolder ? `<div class="pr-holder">${it.holder ? `보유자 <b class="${userClass(it.holder)}">${it.holder}</b>` : '아직 기록 없음'}</div>` : ''}
    </div>`).join('');
}

  { id:'full',      emoji:'👑', name:'풀',           chk:(name)=>userLogs(name).some(l=>parseFloat(l.distance)>=42.195) },
  { id:'sum50',     emoji:'🌱', name:'누적 50',      chk:(name)=>userTotalKm(name)>=50 },
  { id:'sum100',    emoji:'💯', name:'누적 100',     chk:(name)=>userTotalKm(name)>=100 },
  { id:'sum300',    emoji:'🔥', name:'누적 300',     chk:(name)=>userTotalKm(name)>=300 },
  { id:'sum500',    emoji:'🌟', name:'누적 500',     chk:(name)=>userTotalKm(name)>=500 },
  { id:'sum1000',   emoji:'✨', name:'누적 1000',    chk:(name)=>userTotalKm(name)>=1000 },

  { id:'week5',     emoji:'🚀', name:'주 5회',       chk:(name)=>{ const w = {}; for (const l of userLogs(name)) { const dt = new Date(l.run_date+'T00:00'); const dd = dt.getDay()===0?7:dt.getDay(); const m = new Date(dt); m.setDate(dt.getDate()-dd+1); const k = dateKey(m); w[k]=(w[k]||new Set()); w[k].add(l.run_date); } return Object.values(w).some(s=>s.size>=5); } },

function renderBadges() {
  const wrap = $('badgeSectionWrap');
  if (wrap) wrap.style.display = (viewScope === 'all') ? '' : 'none';
  if (viewScope !== 'all') return;
  const namesToShow = scopedNames();
  const el = $('badgeSection');
  el.style.gridTemplateColumns = '';
  el.innerHTML = namesToShow.map(n => {
    const got = badgeDefs.filter(b => b.chk(n)).length;
    return `
      <div class="badge-block">
        <h4><span class="dot ${userClass(n)}"></span>${n} <span class="got-count">${got}/${badgeDefs.length}</span></h4>
        <div class="badges-grid">
          ${badgeDefs.map(b => `
            <div class="badge ${b.chk(n) ? 'unlocked' : 'locked'}" title="${b.name} — ${b.chk(n) ? '획득!' : '아직'}">
              <div class="b-emoji">${b.emoji}</div>
              <div class="b-name">${b.name}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }).join('');
}

function renderUserToggle() {
  const opts = [{ key: 'all', label: '전체' }];
  for (const n of NAMES) { const u = getUserByName(n); if (u) opts.push({ key: String(u.user_id), label: n }); }
  $('userToggle').innerHTML = opts.map(o => `<button class="${calFilter===o.key?'active':''}" onclick="setFilter('${o.key}')">${o.label}</button>`).join('');
}
function setFilter(k) { calFilter = k; renderUserToggle(); renderCalendar(); }

function renderCalendar() {
  $('calMonth').textContent = `${calYear}년 ${calMonth}월`;
  const first = new Date(calYear, calMonth - 1, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(calYear, calMonth, 0).getDate();
  const dateMap = {};
  for (const l of logs) {
    const d = new Date(l.run_date + 'T00:00');
    if (d.getFullYear() === calYear && (d.getMonth() + 1) === calMonth) {
      const k = d.getDate();
      if (!dateMap[k]) dateMap[k] = new Set();
      dateMap[k].add(String(l.user_id));
    }
  }
  const todayD = new Date();
  const isThisMonth = todayD.getFullYear() === calYear && (todayD.getMonth()+1) === calMonth;
  const wkdays = ['일','월','화','수','목','금','토'];
  let html = '<div class="calendar-grid">' + wkdays.map((w, i) =>
    `<div class="cal-weekday" style="color:${i===0?'#9ab8d8':i===6?'#e89aa5':'var(--muted)'}">${w}</div>`).join('');
  for (let i = 0; i < startDay; i++) html += '<div class="cal-day empty"></div>';
  const mhU = getUserByName('미현'), hjU = getUserByName('현주');
  for (let d = 1; d <= daysInMonth; d++) {
    const ids = dateMap[d] ? [...dateMap[d]] : [];
    const filteredIds = calFilter === 'all' ? ids : (ids.includes(calFilter) ? [calFilter] : []);
    const dots = filteredIds.map(id => { const u = getUserById(id); return u ? `<span class="${userClass(u.user_name)}"></span>` : ''; }).join('');
    let bgCls = '';
    if (calFilter === 'all') {
      const hasMh = mhU && ids.includes(String(mhU.user_id));
      const hasHj = hjU && ids.includes(String(hjU.user_id));
      if (hasMh && hasHj) bgCls = ' both';
      else if (hasMh) bgCls = ' mh-only';
      else if (hasHj) bgCls = ' hj-only';
    }
    const todayCls = (isThisMonth && d === todayD.getDate()) ? ' today' : '';
    html += `<div class="cal-day${todayCls}${bgCls}"><span class="num">${d}</span><div class="dots">${dots}</div></div>`;
  }
  html += '</div>';
  $('calendarBody').innerHTML = html;

  const mhDates = new Set(), hjDates = new Set();
  for (const l of logs) {
    const d = new Date(l.run_date + 'T00:00');
    if (d.getFullYear() === calYear && (d.getMonth() + 1) === calMonth) {
      const u = getUserById(l.user_id);
      if (u && u.user_name === '미현') mhDates.add(l.run_date);
      if (u && u.user_name === '현주') hjDates.add(l.run_date);
    }
  }
  let common = 0; for (const d of mhDates) if (hjDates.has(d)) common++;
  const mhKm = userLogs('미현').filter(x => { const d = new Date(x.run_date+'T00:00'); return d.getFullYear()===calYear && (d.getMonth()+1)===calMonth; }).reduce((s,x)=>s+parseFloat(x.distance||0),0);
  const hjKm = userLogs('현주').filter(x => { const d = new Date(x.run_date+'T00:00'); return d.getFullYear()===calYear && (d.getMonth()+1)===calMonth; }).reduce((s,x)=>s+parseFloat(x.distance||0),0);
  $('calSummary').innerHTML = `
    <div>현주 <strong>${hjDates.size}일 · ${hjKm.toFixed(1)}km</strong></div>
    <div>미현 <strong>${mhDates.size}일 · ${mhKm.toFixed(1)}km</strong></div>
    <div>같이 뛴 날 <strong>${common}일</strong></div>
  `;
}

function prevMonth() { calMonth--; if (calMonth < 1) { calMonth = 12; calYear--; } renderCalendar(); }
function nextMonth() { calMonth++; if (calMonth > 12) { calMonth = 1; calYear++; } renderCalendar(); }

function renderFoodTotal() {
  const filteredLogs = getFilteredLogs(foodFilter);
  let totalKcal = 0;
  for (const l of filteredLogs) {
    const u = getUserById(l.user_id); if (!u) continue;
    totalKcal += calcKcal(parseFloat(l.distance||0), u.user_name);
  }
  if (totalKcal === 0) {
    $('foodCard').innerHTML = `<div style="color:var(--gold-text);font-size:13px">아직 태운 칼로리가 없어요. 첫 러닝을 추가하면 음식이 차곡차곡 쌓여요 🍙</div>`;
    return;
  }
  const foods = [
    { kcal: 10, name: '커피', unit: '잔', emoji: '☕' },
    { kcal: 50, name: '초콜릿', unit: '조각', emoji: '🍫' },
    { kcal: 100, name: '붕어빵', unit: '개', emoji: '🥖' },
    { kcal: 250, name: '케이크', unit: '조각', emoji: '🍰' },
    { kcal: 300, name: '맥주', unit: '잔', emoji: '🍺' },
    { kcal: 500, name: '햄버거', unit: '개', emoji: '🍔' },
    { kcal: 600, name: '라면', unit: '봉지', emoji: '🍜' },
    { kcal: 700, name: '피자', unit: '조각', emoji: '🍕' },
    { kcal: 1000, name: '치킨', unit: '마리', emoji: '🍗' },
  ];
  const items = foods.map(f => {
    const cnt = Math.floor(totalKcal / f.kcal);
    return `<div class="food-line-item"><span class="f-emoji">${f.emoji}</span><span class="f-name">${f.name}</span><span class="f-count">${cnt}</span><span class="f-unit">${f.unit}</span></div>`;
  }).join('');
  $('foodCard').innerHTML = `
    <div class="food-total-num">${totalKcal.toLocaleString()}<small> kcal</small></div>
    <div class="food-grid">${items}</div>
  `;
}

let feedExpanded = false;

function renderFeed() {
  const sourceLogs = scopedLogs();
  if (!sourceLogs.length) {
    $('feed').innerHTML = '<div class="empty-state">아직 기록이 없어요. 오른쪽 위 ＋ 기록 추가 버튼으로 첫 러닝을 남겨보세요 🏃‍♀️</div>';
    return;
  }
  const displayCount = feedExpanded ? 30 : 3;
  const logsToShow = sourceLogs.slice(0, displayCount);
  let html = logsToShow.map(l => {
    const u = getUserById(l.user_id);
    const name = u ? u.user_name : '?';
    const cls = userClass(name);
    const km = parseFloat(l.distance || 0);
    const sec = parseInt(l.duration_seconds || 0);
    const kcal = calcKcal(km, name);
    const foodText = getFood(kcal);
    const memo = l.memo ? escapeHtml(l.memo) : '';
    const truncatedMemo = memo.length > 30 ? memo.substring(0, 30) + '...' : memo;
    const memoHtml = memo ? `<span class="memo-text">${truncatedMemo}</span>` : '';
    return `
      <div class="feed-item compact">
        <div class="left"><div class="avatar ${cls}">${name[0]}</div></div>
        <div class="body">
          <div class="meta">
            <span class="name">${name}</span>
            <span class="date">${fmtDate(l.run_date)}</span>
          </div>
          <div class="stat"><strong>${km.toFixed(2)}</strong> km</div>
          <div class="stat"><strong>${fmtDuration(sec)}</strong></div>
          <div class="stat"><strong>${paceFromSec(sec, km)}</strong>/km</div>
          <div class="stat"><strong>${kcal}</strong> kcal</div>
          <div class="food-badge">소모 ≈ ${foodText}</div>
          ${memoHtml}
        </div>
        <div class="actions">
          <button class="edit" onclick="editLog('${l.id}')">수정</button>
          <button class="delete" onclick="deleteLog('${l.id}')">삭제</button>
        </div>
      </div>`;
  }).join('');

  if (sourceLogs.length > 3) {
    const toggleText = feedExpanded ? '위로 접기' : `아래로 펼치기 (${sourceLogs.length - 3}개 더)`;
    html += `<button class="feed-toggle-btn" onclick="toggleFeedExpand()">${toggleText}</button>`;
  }

  $('feed').innerHTML = html;
}

function toggleFeedExpand() {
  feedExpanded = !feedExpanded;
  renderFeed();
}

// ============== Modal handlers (same as before) ==============
function openModal(id) { $(id).classList.add('show'); }
function closeModal(id) { $(id).classList.remove('show'); }

function renderAddPersonOptions() {
  $('addPerson').innerHTML = NAMES.map(n => {
    const cls = userClass(n) + (n === addPersonName ? ' active' : '');
    return `<button type="button" class="${cls}" onclick="setAddPerson('${n}')">${n}</button>`;
  }).join('');
}
function setAddPerson(n) { addPersonName = n; renderAddPersonOptions(); updateAddPreview(); }

function openAddModal() {
  $('addDate').value = new Date().toISOString().slice(0, 10);
  $('addDistance').value = ''; $('addH').value = ''; $('addM').value = ''; $('addS').value = '';
  $('addMemo').value = '';
  updateAddPreview();
  openModal('addModal');
}
function updateAddPreview() {
  const km = parseFloat($('addDistance').value) || 0;
  const h = parseInt($('addH').value) || 0, m = parseInt($('addM').value) || 0, s = parseInt($('addS').value) || 0;
  const sec = h*3600 + m*60 + s;
  const kcal = calcKcal(km, addPersonName);
  let html = '';
  if (km && sec) html += `평균 페이스 <strong>${paceFromSec(sec, km)}/km</strong>`;
  if (km) { if (html) html += ' · '; html += `예상 소모 <strong>${kcal} kcal</strong> ≈ ${getFood(kcal)}`; }
  if (!html) html = '거리·시간을 입력하면 페이스 · 칼로리가 자동 계산돼요';
  $('addPreview').innerHTML = html;
}
['addDistance','addH','addM','addS'].forEach(id => {
  document.addEventListener('input', e => { if (e.target && e.target.id === id) updateAddPreview(); });
});

async function submitAdd() {
  const u = getUserByName(addPersonName);
  if (!u) { toast('사용자를 찾을 수 없어요'); return; }
  const date = $('addDate').value;
  const km = parseFloat($('addDistance').value);
  const h = parseInt($('addH').value) || 0, m = parseInt($('addM').value) || 0, s = parseInt($('addS').value) || 0;
  const sec = h*3600 + m*60 + s;
  if (!date) { toast('날짜를 선택해 주세요'); return; }
  if (!km || km <= 0) { toast('거리를 입력해 주세요'); return; }
  if (!sec) { toast('시간을 입력해 주세요'); return; }

  $('addSubmit').disabled = true;
  const { error } = await sb.from('run_log').insert({
    user_id: u.user_id, run_date: date, distance: km, duration_seconds: sec,
    memo: $('addMemo').value || null
  });
  $('addSubmit').disabled = false;
  if (error) {
    toast('저장 실패: ' + error.message);
    if (error.message.toLowerCase().includes('row-level') || error.message.toLowerCase().includes('policy')) {
      showHelp(`<b>RLS 정책이 막혀있어요.</b> SQL Editor에 아래를 실행해 주세요:<br><code>CREATE POLICY p_log ON run_log FOR ALL TO anon USING (true) WITH CHECK (true);</code>`);
    }
    return;
  }
  toast('기록이 저장됐어요 🏃‍♀️');
  closeModal('addModal');
  await loadAll();
}

function editLog(id) {
  const log = logs.find(l => l.id === id);
  if (!log) return;
  const u = getUserById(log.user_id);
  const name = u ? u.user_name : '?';

  $('addDate').value = log.run_date;
  $('addDistance').value = parseFloat(log.distance || 0);
  const sec = parseInt(log.duration_seconds || 0);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  $('addH').value = h || '';
  $('addM').value = m || '';
  $('addS').value = s || '';
  $('addMemo').value = log.memo || '';
  addPersonName = name;

  const modalTitle = document.querySelector('#addModal h3');
  const submitBtn = $('addSubmit');
  modalTitle.textContent = '러닝 기록 수정';
  submitBtn.textContent = '수정';
  submitBtn.onclick = () => submitEdit(id);

  renderAddPersonOptions();
  updateAddPreview();
  openModal('addModal');
}

async function submitEdit(id) {
  const u = getUserByName(addPersonName);
  if (!u) { toast('사용자를 찾을 수 없어요'); return; }
  const date = $('addDate').value;
  const km = parseFloat($('addDistance').value);
  const h = parseInt($('addH').value) || 0, m = parseInt($('addM').value) || 0, s = parseInt($('addS').value) || 0;
  const sec = h*3600 + m*60 + s;
  if (!date) { toast('날짜를 선택해 주세요'); return; }
  if (!km || km <= 0) { toast('거리를 입력해 주세요'); return; }
  if (!sec) { toast('시간을 입력해 주세요'); return; }

  const { error } = await sb.from('run_log').update({
    user_id: u.user_id, run_date: date, distance: km, duration_seconds: sec,
    memo: $('addMemo').value || null
  }).eq('id', id);

  if (error) { toast('수정 실패: ' + error.message); return; }
  toast('수정됐어요');
  const modalTitle = document.querySelector('#addModal h3');
  const submitBtn = $('addSubmit');
  modalTitle.textContent = '러닝 기록 추가';
  submitBtn.textContent = '저장';
  submitBtn.onclick = submitAdd;
  closeModal('addModal');
  await loadAll();
}

async function deleteLog(id) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  const { error } = await sb.from('run_log').delete().eq('id', id);
  if (error) { toast('삭제 실패: ' + error.message); return; }
  toast('삭제됐어요'); await loadAll();
}

function openGoal(userId, name) {
  goalEditingUserId = userId;
  $('goalModalTitle').textContent = `${name} 목표 설정`;
  const ex = goals.find(g => String(g.user_id) === String(userId));
  if (ex) { $('goalType').value = ex.goal_type; $('goalValue').value = ex.target_value; }
  else { $('goalType').value = 'MONTHLY_DISTANCE'; $('goalValue').value = ''; }
  openModal('goalModal');
}

async function submitGoal() {
  const type = $('goalType').value;
  const val = parseFloat($('goalValue').value);
  if (!val || val <= 0) { toast('목표값을 입력해 주세요'); return; }
  const y = today.getFullYear(), m = today.getMonth() + 1;
  await sb.from('run_goal').delete().eq('user_id', goalEditingUserId).eq('goal_year', y).eq('goal_month', m);
  const { error } = await sb.from('run_goal').insert({ user_id: goalEditingUserId, goal_year: y, goal_month: m, goal_type: type, target_value: val });
  if (error) { toast('저장 실패: ' + error.message); return; }
  toast('목표가 저장됐어요!'); closeModal('goalModal'); await loadAll();
}

function openSetup() {
  $('weightMh').value = localStorage.getItem('weight_미현') || '';
  $('weightHj').value = localStorage.getItem('weight_현주') || '';
  openModal('setupModal');
}
function submitWeights() {
  if ($('weightMh').value) setWeight('미현', $('weightMh').value);
  if ($('weightHj').value) setWeight('현주', $('weightHj').value);
  closeModal('setupModal'); renderAll(); toast('저장됐어요');
}

function openLightbox(url) { $('lightboxImg').src = url; $('lightbox').classList.add('show'); }
function closeLightbox() { $('lightbox').classList.remove('show'); }

document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('show'); });
});

loadAll();
</script>
