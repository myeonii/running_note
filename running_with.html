<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>같이 뛰자 — 미현 & 현주</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #FAFAFA;
  --card: #FFFFFF;
  --text: #1A1A1A;
  --sub: #6B6B6B;
  --muted: #B5B5B5;
  --line: #ECECEC;
  --line-strong: #DDD;
  --mh: #F4A8B4;
  --mh-strong: #E8869B;
  --mh-bg: #FDF1F4;
  --mh-text: #6b3942;
  --hj: #A8C8E8;
  --hj-strong: #7FA8D2;
  --hj-bg: #EDF4FB;
  --hj-text: #2d4d6e;
  --accent: #111111;
  --gold: #F2C94C;
  --gold-bg: #FFF8E1;
  --gold-text: #6b5a00;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 28px 20px 120px; }

header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
header h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.6px; }
header .sub { color: var(--sub); font-size: 12px; margin-top: 4px; }

button { font-family: inherit; cursor: pointer; }
.btn { background: var(--accent); color: #fff; border: 0; padding: 11px 20px; border-radius: 100px; font-weight: 700; font-size: 13px; }
.btn:hover { opacity: .9; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 8px 14px; border-radius: 100px; font-weight: 500; font-size: 12px; }
.btn-ghost:hover { background: #F2F2F2; }

section { margin-bottom: 32px; }
.section-title { font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
.section-emoji { margin-right: 4px; }

.card { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--line); }

/* ===== User goal cards ===== */
.users-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.user-card { padding: 22px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card); position: relative; min-height: 160px; }
.user-card.mh { background: var(--mh-bg); border-color: #fadfe5; }
.user-card.hj { background: var(--hj-bg); border-color: #d6e6f5; }
.user-card .name { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.user-card .dot { width: 8px; height: 8px; border-radius: 50%; }
.user-card .dot.mh { background: var(--mh-strong); }
.user-card .dot.hj { background: var(--hj-strong); }
.user-card .goal-label { color: var(--sub); font-size: 12px; margin-top: 10px; }
.user-card .progress-num { font-size: 28px; font-weight: 800; margin-top: 14px; letter-spacing: -.5px; }
.user-card .progress-num small { font-size: 12px; font-weight: 500; color: var(--sub); margin-left: 4px; }
.progress-bar { height: 6px; background: rgba(0,0,0,0.06); border-radius: 100px; overflow: hidden; margin-top: 10px; }
.progress-bar .fill { height: 100%; transition: width .5s cubic-bezier(.4,0,.2,1); border-radius: 100px; }
.progress-bar .fill.mh { background: var(--mh-strong); }
.progress-bar .fill.hj { background: var(--hj-strong); }
.user-card .edit { position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,0.7); border: 0; border-radius: 100px; padding: 5px 11px; font-size: 11px; color: var(--sub); cursor: pointer; }
.user-card .edit:hover { background: #fff; color: var(--text); }
.user-card .streak { display: flex; gap: 10px; margin-top: 12px; font-size: 11px; flex-wrap: wrap; }
.user-card .streak .chip { background: rgba(255,255,255,0.65); padding: 4px 10px; border-radius: 100px; }

/* ===== Combined stats ===== */
.combined-card { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: center; }
.total-num { font-size: 44px; font-weight: 800; letter-spacing: -1.8px; line-height: 1; }
.total-num small { font-size: 14px; font-weight: 500; color: var(--sub); margin-left: 2px; }
.contribution-bar { height: 30px; border-radius: 100px; overflow: hidden; display: flex; margin-top: 14px; background: #F2F2F2; }
.contribution-bar > div { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; transition: width .5s ease; min-width: 0; }
.contribution-bar .mh-fill { background: var(--mh); color: var(--mh-text); }
.contribution-bar .hj-fill { background: var(--hj); color: var(--hj-text); }
.fun-msg { background: var(--gold-bg); border-radius: var(--radius-sm); padding: 16px; font-size: 13px; line-height: 1.55; color: var(--gold-text); border: 1px solid #FCE9A8; }
.together-stat { display: inline-block; margin-top: 10px; font-size: 12px; color: var(--sub); }
.together-stat strong { color: var(--text); font-weight: 700; }

/* ===== Trip / Journey ===== */
.trip-card { background: linear-gradient(135deg, #FFF8E1 0%, #F0F7FF 50%, #FDF1F4 100%); border: 1px solid var(--line); }
.trip-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
.trip-now { display: flex; align-items: center; gap: 14px; }
.trip-emoji { font-size: 38px; line-height: 1; }
.trip-current-name { font-size: 18px; font-weight: 800; }
.trip-current-detail { font-size: 12px; color: var(--sub); margin-top: 2px; }
.trip-pct-big { font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
.trip-pct-big small { font-size: 11px; color: var(--sub); font-weight: 500; }
.trip-track { position: relative; height: 8px; background: rgba(0,0,0,0.08); border-radius: 100px; overflow: hidden; margin: 18px 0; }
.trip-track-fill { height: 100%; background: linear-gradient(90deg, var(--mh-strong), var(--hj-strong)); border-radius: 100px; transition: width .8s cubic-bezier(.4,0,.2,1); }
.trip-cities { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.trip-city { padding: 5px 10px; border-radius: 100px; background: rgba(255,255,255,0.6); color: var(--sub); border: 1px solid transparent; white-space: nowrap; }
.trip-city.visited { background: rgba(255,255,255,0.9); color: var(--text); }
.trip-city.current { background: var(--accent); color: #fff; font-weight: 700; }
.trip-city.upcoming { color: var(--muted); border-color: var(--line); background: transparent; }
.trip-next { font-size: 12px; color: var(--sub); margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.06); }
.trip-next strong { color: var(--text); font-weight: 700; }

/* ===== Weekly chart ===== */
.weekly-chart { display: flex; gap: 6px; align-items: flex-end; height: 180px; padding: 0 4px; }
.week-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.week-bar-stack { width: 100%; display: flex; flex-direction: column; justify-content: flex-end; height: 140px; gap: 2px; }
.week-bar-fill { width: 100%; border-radius: 4px 4px 0 0; min-height: 0; transition: height .4s ease; position: relative; }
.week-bar-fill.mh { background: var(--mh); }
.week-bar-fill.hj { background: var(--hj); }
.week-bar-fill.zero { background: rgba(0,0,0,0.04); border-radius: 4px; min-height: 4px; }
.week-bar-label { font-size: 9px; color: var(--muted); text-align: center; font-weight: 600; }
.week-bar-total { font-size: 10px; color: var(--text); font-weight: 700; margin-top: 2px; }
.chart-legend { display: flex; gap: 14px; justify-content: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--sub); }
.chart-legend .lg { display: flex; align-items: center; gap: 6px; }
.chart-legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.chart-legend .sw.mh { background: var(--mh); }
.chart-legend .sw.hj { background: var(--hj); }

/* ===== Heatmap ===== */
.heatmap-wrapper { overflow-x: auto; padding-bottom: 4px; }
.heatmap { display: grid; grid-template-rows: repeat(7, 11px); grid-auto-flow: column; grid-auto-columns: 11px; gap: 2px; min-width: 720px; }
.hm-cell { width: 11px; height: 11px; border-radius: 2px; background: #EDEDED; }
.hm-cell.hm-1 { background: #F8D8DE; }
.hm-cell.hm-2 { background: #F4A8B4; }
.hm-cell.hm-3 { background: #E07A91; }
.hm-cell.hm-4 { background: #C95471; }
.hm-cell.both-1 { background: linear-gradient(135deg, #F8D8DE 50%, #D6E6F5 50%); }
.hm-cell.both-2 { background: linear-gradient(135deg, #F4A8B4 50%, #A8C8E8 50%); }
.hm-cell.both-3 { background: linear-gradient(135deg, #E07A91 50%, #7FA8D2 50%); }
.hm-cell.both-4 { background: linear-gradient(135deg, #C95471 50%, #4F86B6 50%); }
.heatmap-months { display: flex; gap: 2px; min-width: 720px; font-size: 10px; color: var(--muted); margin-bottom: 4px; padding-left: 22px; font-weight: 600; }
.heatmap-row { display: flex; align-items: flex-start; gap: 8px; }
.heatmap-days { display: grid; grid-template-rows: repeat(7, 11px); gap: 2px; font-size: 9px; color: var(--muted); padding-top: 0; }
.heatmap-days span { line-height: 11px; height: 11px; }
.heatmap-legend { display: flex; gap: 6px; justify-content: flex-end; align-items: center; font-size: 11px; color: var(--sub); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.heatmap-legend .hm-cell { display: inline-block; }
.heatmap-stats { display: flex; gap: 16px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.heatmap-stats .stat { font-size: 12px; color: var(--sub); }
.heatmap-stats .stat strong { color: var(--text); font-size: 16px; font-weight: 800; display: block; }

/* ===== PR Board ===== */
.pr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.pr-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; position: relative; overflow: hidden; }
.pr-card .pr-label { font-size: 10px; color: var(--muted); font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
.pr-card .pr-emoji { position: absolute; top: 12px; right: 12px; font-size: 22px; opacity: .8; }
.pr-card .pr-value { font-size: 22px; font-weight: 800; margin-top: 4px; letter-spacing: -.5px; }
.pr-card .pr-value small { font-size: 11px; color: var(--sub); font-weight: 500; }
.pr-card .pr-holder { font-size: 11px; color: var(--sub); margin-top: 4px; }
.pr-card .pr-holder b { font-weight: 700; }
.pr-card .pr-holder b.mh { color: var(--mh-text); }
.pr-card .pr-holder b.hj { color: var(--hj-text); }

/* ===== Badges ===== */
.badge-section { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.badge-block h4 { font-size: 13px; font-weight: 700; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
.badge-block h4 .dot { width: 8px; height: 8px; border-radius: 50%; }
.badge-block h4 .dot.mh { background: var(--mh-strong); }
.badge-block h4 .dot.hj { background: var(--hj-strong); }
.badge-block .got-count { color: var(--muted); font-size: 11px; font-weight: 500; margin-left: auto; }
.badges-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.badge { aspect-ratio: 1; border-radius: 12px; background: #F5F5F5; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 4px; text-align: center; position: relative; cursor: help; }
.badge.unlocked { background: linear-gradient(135deg, #FFF8E1 0%, #FCE9A8 100%); }
.badge.locked { opacity: .35; filter: grayscale(.7); }
.badge .b-emoji { font-size: 22px; line-height: 1.1; }
.badge .b-name { font-size: 9px; color: var(--sub); font-weight: 700; margin-top: 2px; line-height: 1.2; }
.badge.unlocked .b-name { color: var(--gold-text); }

/* ===== Calendar ===== */
.calendar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
.cal-nav { display: flex; align-items: center; gap: 8px; }
.cal-nav button { background: transparent; border: 1px solid var(--line); border-radius: 100px; width: 30px; height: 30px; font-size: 14px; }
.cal-nav button:hover { background: #F2F2F2; }
.cal-month { font-size: 14px; font-weight: 700; min-width: 110px; text-align: center; }
.user-toggle { display: flex; gap: 4px; background: #F2F2F2; padding: 3px; border-radius: 100px; }
.user-toggle button { background: transparent; border: 0; padding: 6px 14px; border-radius: 100px; font-size: 12px; color: var(--sub); cursor: pointer; }
.user-toggle button.active { background: #fff; color: var(--text); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-day { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--sub); position: relative; background: #FAFAFA; padding: 4px 0; }
.cal-day.empty { background: transparent; }
.cal-day.today { border: 1.5px solid var(--accent); font-weight: 800; color: var(--text); background: #fff; }
.cal-day.both { background: linear-gradient(135deg, var(--mh-bg) 50%, var(--hj-bg) 50%); }
.cal-day.mh-only { background: var(--mh-bg); }
.cal-day.hj-only { background: var(--hj-bg); }
.cal-day .num { font-size: 12px; }
.cal-day .dots { display: flex; gap: 2px; margin-top: 4px; min-height: 6px; }
.cal-day .dots span { width: 6px; height: 6px; border-radius: 50%; }
.cal-day .dots .mh { background: var(--mh-strong); }
.cal-day .dots .hj { background: var(--hj-strong); }
.cal-weekday { font-size: 10px; color: var(--muted); text-align: center; padding: 4px 0; font-weight: 700; }
.cal-summary { display: flex; gap: 16px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--sub); flex-wrap: wrap; }
.cal-summary strong { color: var(--text); font-weight: 700; }

/* ===== Food total ===== */
.food-card { background: linear-gradient(135deg, #FFF8E1 0%, #FFF3D6 100%); border: 1px solid #FCE9A8; }
.food-total-num { font-size: 32px; font-weight: 800; color: var(--gold-text); letter-spacing: -1px; }
.food-total-num small { font-size: 13px; color: #8a7400; font-weight: 500; margin-left: 4px; }
.food-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 16px; }
.food-item { background: rgba(255,255,255,0.7); border-radius: 10px; padding: 12px 10px; text-align: center; }
.food-item .f-emoji { font-size: 28px; line-height: 1.2; }
.food-item .f-count { font-size: 16px; font-weight: 800; color: var(--text); margin-top: 4px; }
.food-item .f-name { font-size: 11px; color: var(--sub); margin-top: 2px; }

/* ===== Feed ===== */
.feed-item { display: flex; gap: 14px; padding: 18px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); margin-bottom: 10px; }
.feed-item .left { flex-shrink: 0; }
.feed-item .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #fff; }
.feed-item .avatar.mh { background: var(--mh-strong); }
.feed-item .avatar.hj { background: var(--hj-strong); }
.feed-item .body { flex: 1; min-width: 0; }
.feed-item .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.feed-item .name { font-weight: 800; font-size: 14px; }
.feed-item .date { color: var(--muted); font-size: 12px; flex: 1; }
.feed-item .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
.feed-item .stat { font-size: 12px; }
.feed-item .stat strong { font-size: 15px; font-weight: 800; }
.feed-item .stat label { color: var(--muted); display: block; font-size: 10px; margin-bottom: 2px; font-weight: 600; }
.feed-item .memo { color: var(--sub); font-size: 13px; margin-top: 12px; line-height: 1.55; white-space: pre-wrap; padding: 10px 12px; background: #FAFAFA; border-radius: var(--radius-sm); }
.feed-item .photo { margin-top: 10px; }
.feed-item .photo img { max-width: 100%; max-height: 320px; border-radius: var(--radius-sm); display: block; cursor: pointer; }
.feed-item .food { display: inline-block; margin-top: 10px; background: var(--gold-bg); padding: 6px 12px; border-radius: 100px; font-size: 12px; color: var(--gold-text); border: 1px solid #FCE9A8; }
.feed-item .delete { background: transparent; border: 0; color: var(--muted); font-size: 11px; cursor: pointer; padding: 2px 6px; }
.feed-item .delete:hover { color: #d33; }

/* ===== Floating add button ===== */
.fab { position: fixed; right: 24px; bottom: 24px; background: var(--accent); color: #fff; border: 0; width: 58px; height: 58px; border-radius: 50%; font-size: 30px; box-shadow: 0 6px 20px rgba(0,0,0,0.22); cursor: pointer; line-height: 0; padding-bottom: 4px; z-index: 50; }
.fab:hover { transform: translateY(-2px); transition: transform .2s; }

/* ===== Modal ===== */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
.modal-bg.show { display: flex; }
.modal { background: #fff; border-radius: 20px 20px 0 0; padding: 24px 22px 30px; max-width: 480px; width: 100%; max-height: 92vh; overflow-y: auto; }
@media (min-width: 600px) { .modal-bg { align-items: center; } .modal { border-radius: var(--radius); } }
.modal h3 { margin: 0 0 18px; font-size: 16px; font-weight: 800; }
.modal .field { margin-bottom: 14px; }
.modal label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 6px; font-weight: 600; }
.modal input, .modal textarea, .modal select {
  width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; background: #fff; color: var(--text);
}
.modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: var(--accent); }
.modal textarea { resize: vertical; min-height: 60px; }
.modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.modal .row3 input { text-align: center; }
.modal .preview { background: #FAFAFA; border-radius: var(--radius-sm); padding: 12px; font-size: 12px; color: var(--sub); margin-bottom: 14px; line-height: 1.7; }
.modal .preview strong { color: var(--text); font-weight: 800; }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; }
.modal-actions .btn { flex: 1; }
.modal-actions .btn-ghost { flex: 0 0 auto; }
.person-toggle { display: flex; gap: 6px; }
.person-toggle button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: var(--radius-sm); padding: 12px; font-weight: 700; font-size: 13px; cursor: pointer; transition: all .15s; }
.person-toggle button.active.mh { background: var(--mh-bg); color: var(--mh-text); border-color: var(--mh-strong); }
.person-toggle button.active.hj { background: var(--hj-bg); color: var(--hj-text); border-color: var(--hj-strong); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); }
.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.86); color: #fff; padding: 11px 18px; border-radius: 100px; font-size: 13px; z-index: 1000; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.show { opacity: 1; }

.help-banner { background: var(--gold-bg); border: 1px solid #FCE9A8; border-radius: var(--radius-sm); padding: 14px 16px; font-size: 12px; line-height: 1.7; color: var(--gold-text); margin-bottom: 18px; }
.help-banner code { background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; font-size: 11px; font-family: 'SF Mono', Menlo, Consolas, monospace; }
.help-banner b { color: #3d3000; }

/* Lightbox */
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; z-index: 200; cursor: pointer; }
.lightbox.show { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh; }

/* Tooltip on heatmap cells */
.hm-cell[title]:hover { outline: 2px solid var(--accent); outline-offset: 1px; }

@media (max-width: 600px) {
  .users-grid { grid-template-columns: 1fr; }
  .combined-card { grid-template-columns: 1fr; }
  .total-num { font-size: 36px; }
  .feed-item .stats { grid-template-columns: repeat(2, 1fr); }
  .badge-section { grid-template-columns: 1fr; }
  .badges-grid { grid-template-columns: repeat(5, 1fr); }
  header h1 { font-size: 19px; }
}
</style>

  const dates = [...new Set(userLogs(name).map(l => l.run_date))].sort();

  for (const d of dates) { if (prev && daysBetween(prev, d) === 1) cur++; else cur = 1; if (cur > max) max = cur; prev = d; }

  const dates = [...new Set(userLogs(name).map(l => l.run_date))].sort().reverse();
  if (!dates.length) return 0;
  const todayKey = dateKey(new Date()); const yKey = dateKey(new Date(Date.now() - 86400000));
  if (dates[0] !== todayKey && dates[0] !== yKey) return 0;
  let cur = 1, prev = dates[0];
  for (let i = 1; i < dates.length; i++) { if (daysBetween(dates[i], prev) === 1) { cur++; prev = dates[i]; } else break; }
  return cur;
}

}

    if (!u) return `<div class="user-card"><div class="name"><span class="dot ${userClass(name)}"></span>${name}</div><div class="goal-label">아직 등록되지 않았어요</div></div>`;
    const goal = goals.find(g => String(g.user_id) === String(u.user_id));
    let progress = 0, target = 0, label = '목표 미설정';
    if (goal) {
      target = parseFloat(goal.target_value);
      if (goal.goal_type === 'MONTHLY_DISTANCE') {
        const km = userLogs(name).filter(x => { const d = new Date(x.run_date+'T00:00'); return d.getFullYear()===today.getFullYear() && d.getMonth()+1===today.getMonth()+1; }).reduce((s,x) => s+parseFloat(x.distance||0), 0);
        progress = km;
        label = `이번 달 <strong>${km.toFixed(1)} / ${target}</strong> km`;
      } else if (goal.goal_type === 'WEEKLY_COUNT') {
        const d = new Date(); const day = d.getDay() === 0 ? 7 : d.getDay();
        const mon = new Date(d); mon.setDate(d.getDate()-day+1); mon.setHours(0,0,0,0);
        const sun = new Date(mon); sun.setDate(mon.getDate()+7);
        const cnt = new Set(userLogs(name).filter(x => { const dt = new Date(x.run_date+'T00:00'); return dt >= mon && dt < sun; }).map(x => x.run_date)).size;
        progress = cnt;
        label = `이번 주 <strong>${cnt} / ${target}</strong> 회`;
      }
    }
    const pct = target ? Math.min(100, (progress / target) * 100) : 0;
    const streak = userCurrentStreak(name);
    const lastDate = userLastRunDate(name);
    const lastDays = lastDate ? daysBetween(lastDate, dateKey(new Date())) : null;
    let lastTxt = '아직 기록 없음';
    if (lastDays === 0) lastTxt = '오늘도 뛰었어요!';
    else if (lastDays === 1) lastTxt = '어제 뛰었어요';
    else if (lastDays !== null) lastTxt = `${lastDays}일 전`;

    const streakChip = streak > 0 ? `<span class="chip">🔥 ${streak}일 연속</span>` : '';
    const lastChip = `<span class="chip">📅 ${lastTxt}</span>`;
    return `
      <div class="user-card ${userClass(name)}">
        <button class="edit" onclick="openGoal('${u.user_id}','${name}')">목표 ${goal ? '수정' : '설정'}</button>
        <div class="name"><span class="dot ${userClass(name)}"></span>${name}</div>
        <div class="goal-label">${label}</div>
        <div class="progress-num">${pct.toFixed(0)}<small>% 달성</small></div>
        <div class="progress-bar"><div class="fill ${userClass(name)}" style="width:${pct}%"></div></div>
        <div class="streak">${streakChip}${lastChip}</div>
      </div>`;
  }).join('');
  $('userCards').innerHTML = html;
}

function renderTrip() {
  const total = logs.reduce((s, x) => s + parseFloat(x.distance || 0), 0);
  // find current segment
  let seg = { from: cities[0], to: cities[1], pct: 0 };
  for (let i = 0; i < cities.length - 1; i++) {
    if (total >= cities[i].km && total < cities[i+1].km) {
      seg = { from: cities[i], to: cities[i+1], pct: (total - cities[i].km) / (cities[i+1].km - cities[i].km) };
      break;
    }
  }
  if (total >= cities[cities.length - 1].km) {
    seg = { from: cities[cities.length - 1], to: null, pct: 1 };
  }
  // Build city chips: show 5 around current
  const fromIdx = cities.findIndex(c => c === seg.from);
  const start = Math.max(0, fromIdx - 2);
  const end = Math.min(cities.length, fromIdx + 4);
  const slice = cities.slice(start, end);
  const chips = slice.map((c, i) => {
    let cls = 'upcoming';
    if (i + start < fromIdx) cls = 'visited';
    else if (i + start === fromIdx) cls = 'visited';
    else if (i + start === fromIdx + 1) cls = 'current';
    return `<div class="trip-city ${cls}">${c.emoji} ${c.name}</div>`;
  }).join('');

  const distLeft = seg.to ? (seg.to.km - total).toFixed(0) : 0;
  const segPct = (seg.pct * 100).toFixed(0);
  const totalPctOfFinal = Math.min(100, (total / cities[cities.length-1].km) * 100);

  $('tripCard').innerHTML = `
    <div class="trip-header">
      <div class="trip-now">
        <div class="trip-emoji">${seg.from.emoji}</div>
        <div>
          <div class="trip-current-name">지금 ${seg.from.name} ${seg.to ? '근처' : '도착!'}</div>
          <div class="trip-current-detail">${total.toFixed(1)}km / ${cities[cities.length-1].km.toLocaleString()}km · 전체 ${totalPctOfFinal.toFixed(2)}%</div>
        </div>
      </div>
      <div class="trip-pct-big">${segPct}%<small> 다음 도시까지</small></div>
    </div>
    <div class="trip-track"><div class="trip-track-fill" style="width:${seg.pct*100}%"></div></div>
    <div class="trip-cities">${chips}</div>
    ${seg.to ? `<div class="trip-next">🎯 다음 목적지 <strong>${seg.to.emoji} ${seg.to.name}</strong>까지 <strong>${distLeft}km</strong> 남았어요</div>` : '<div class="trip-next">🏆 모든 도시 정복! 전설의 러너가 되었습니다</div>'}
  `;
}

function renderWeeklyChart() {
  // last 12 weeks (Mon-Sun)
  const d = new Date(); const day = d.getDay() === 0 ? 7 : d.getDay();
  const thisMon = new Date(d); thisMon.setDate(d.getDate() - day + 1); thisMon.setHours(0,0,0,0);
  const weeks = [];
  for (let i = 11; i >= 0; i--) {
    const start = new Date(thisMon); start.setDate(thisMon.getDate() - i*7);
    const end = new Date(start); end.setDate(start.getDate() + 7);
    weeks.push({ start, end, mh: 0, hj: 0 });
  }
  for (const l of logs) {
    const dt = new Date(l.run_date + 'T00:00');
    for (const w of weeks) {
      if (dt >= w.start && dt < w.end) {
        const u = getUserById(l.user_id);
        if (u && u.user_name === '미현') w.mh += parseFloat(l.distance||0);
        if (u && u.user_name === '현주') w.hj += parseFloat(l.distance||0);
        break;
      }
    }
  }
  const max = Math.max(0.1, ...weeks.map(w => w.mh + w.hj));
  $('weeklyChart').innerHTML = weeks.map((w, i) => {
    const total = w.mh + w.hj;
    const totalH = total === 0 ? 0 : (total / max) * 100;
    const mhH = total === 0 ? 0 : (w.mh / total) * totalH;
    const hjH = total === 0 ? 0 : (w.hj / total) * totalH;
    const label = i === 11 ? '이번주' : `${w.start.getMonth()+1}/${w.start.getDate()}`;
    if (total === 0) {
      return `<div class="week-bar"><div class="week-bar-stack"><div class="week-bar-fill zero" style="height:4px"></div></div><div class="week-bar-total" style="color:var(--muted)">-</div><div class="week-bar-label">${label}</div></div>`;
    }
    return `
      <div class="week-bar" title="${label}: 미현 ${w.mh.toFixed(1)}km, 현주 ${w.hj.toFixed(1)}km">
        <div class="week-bar-stack">
          ${w.mh > 0 ? `<div class="week-bar-fill mh" style="height:${mhH}%"></div>` : ''}
          ${w.hj > 0 ? `<div class="week-bar-fill hj" style="height:${hjH}%"></div>` : ''}
        </div>
        <div class="week-bar-total">${total.toFixed(0)}</div>
        <div class="week-bar-label">${label}</div>
      </div>`;
  }).join('');
}

function renderHeatmap() {
  // 365 days back from today, aligned to Sunday-start
  const todayD = new Date(); todayD.setHours(0,0,0,0);
  const start = new Date(todayD); start.setDate(todayD.getDate() - 364);
  // Adjust start to Sunday (getDay 0=Sun)
  start.setDate(start.getDate() - start.getDay());
  // Build map
  const dayMap = {}; // date -> { mhKm, hjKm }
  for (const l of logs) {
    const k = l.run_date;
    if (!dayMap[k]) dayMap[k] = { mhKm: 0, hjKm: 0 };
    const u = getUserById(l.user_id);
    if (u && u.user_name === '미현') dayMap[k].mhKm += parseFloat(l.distance||0);
    if (u && u.user_name === '현주') dayMap[k].hjKm += parseFloat(l.distance||0);
  }
  const cells = [];
  const cur = new Date(start);
  let monthLabels = [];
  let lastMonth = -1;
  while (cur <= todayD) {
    const k = dateKey(cur);
    const e = dayMap[k] || { mhKm: 0, hjKm: 0 };
    const km = e.mhKm + e.hjKm;
    let lvl = 0;
    if (km > 0) lvl = 1;
    if (km >= 3) lvl = 2;
    if (km >= 6) lvl = 3;
    if (km >= 10) lvl = 4;
    const both = e.mhKm > 0 && e.hjKm > 0;
    let cls = `hm-cell hm-${lvl}`;
    if (lvl > 0 && both) cls = `hm-cell both-${lvl}`;
    const tip = `${k}\n미현 ${e.mhKm.toFixed(1)}km · 현주 ${e.hjKm.toFixed(1)}km`;
    cells.push(`<div class="${cls}" title="${tip}"></div>`);
    cur.setDate(cur.getDate() + 1);
  }
  $('heatmap').innerHTML = cells.join('');

  // Month labels — every Sunday, mark first occurrence of month
  const monthEls = [];
  const cur2 = new Date(start);
  let week = 0;
  let labels = new Array(54).fill('');
  let seen = new Set();
  while (cur2 <= todayD) {
    if (cur2.getDay() === 0) {
      const m = cur2.getMonth();
      if (!seen.has(m) && cur2.getDate() <= 7) { labels[week] = `${m+1}월`; seen.add(m); }
      week++;
    }
    cur2.setDate(cur2.getDate() + 1);
  }
  $('heatmapMonths').innerHTML = labels.map(l => `<div style="width:11px;flex:0 0 11px">${l}</div>`).join('');

  // Stats
  const allKeys = Object.keys(dayMap);
  const past365Keys = allKeys.filter(k => { const dt = new Date(k+'T00:00'); return dt >= start && dt <= todayD; });
  const totalRunDays = past365Keys.length;
  const totalKm365 = past365Keys.reduce((s,k) => s + dayMap[k].mhKm + dayMap[k].hjKm, 0);
  const dowCount = [0,0,0,0,0,0,0];
  for (const k of past365Keys) { dowCount[new Date(k+'T00:00').getDay()]++; }
  const dows = ['일','월','화','수','목','금','토'];
  const maxDow = Math.max(...dowCount);
  const favDay = dowCount.indexOf(maxDow);
  $('heatmapStats').innerHTML = `
    <div class="stat"><strong>${totalRunDays}일</strong>지난 365일 중 뛴 날</div>
    <div class="stat"><strong>${totalKm365.toFixed(0)}km</strong>최근 1년 누적</div>
    <div class="stat"><strong>${dows[favDay]}요일</strong>제일 좋아하는 요일 (${maxDow}회)</div>
    <div class="stat"><strong>${(totalRunDays/365*100).toFixed(0)}%</strong>출석률</div>
  `;
}

function renderPRBoard() {
  const items = [];

  let longest = { km: 0, name: null };
  for (const n of NAMES) { const r = userLongestRun(n); if (r.km > longest.km) longest = { km: r.km, name: n }; }
  items.push({ label: '최장 단일 거리', value: longest.km > 0 ? `${longest.km.toFixed(2)}<small> km</small>` : '-', holder: longest.name, emoji: '🏃‍♀️' });
  // 최단 페이스
  let bestPace = { sec: null, name: null };
  for (const n of NAMES) { const p = userBestPace(n); if (p && (bestPace.sec === null || p < bestPace.sec)) bestPace = { sec: p, name: n }; }
  items.push({ label: '최단 평균 페이스', value: bestPace.sec ? `${Math.floor(bestPace.sec/60)}'${String(Math.round(bestPace.sec%60)).padStart(2,'0')}"<small>/km</small>` : '-', holder: bestPace.name, emoji: '💨' });

  for (const n of NAMES) { const s = userLongestDuration(n); if (s > longestT.sec) longestT = { sec: s, name: n }; }
  items.push({ label: '최장 러닝 시간', value: longestT.sec > 0 ? fmtDuration(longestT.sec) : '-', holder: longestT.name, emoji: '⏱️' });
  // 최다 주간 km
  let bestWeek = { km: 0, name: null };

  items.push({ label: '최다 주간 거리', value: bestWeek.km > 0 ? `${bestWeek.km.toFixed(1)}<small> km</small>` : '-', holder: bestWeek.name, emoji: '🔥' });
  // 최다 월간 km
  let bestMonth = { km: 0, name: null };
  for (const n of NAMES) { const k = userMaxMonthKm(n); if (k > bestMonth.km) bestMonth = { km: k, name: n }; }
  items.push({ label: '최다 월간 거리', value: bestMonth.km > 0 ? `${bestMonth.km.toFixed(1)}<small> km</small>` : '-', holder: bestMonth.name, emoji: '🏆' });
  // 최장 연속 출석
  let bestStreak = { d: 0, name: null };
  for (const n of NAMES) { const s = userMaxStreak(n); if (s > bestStreak.d) bestStreak = { d: s, name: n }; }
  items.push({ label: '최장 연속 출석', value: bestStreak.d > 0 ? `${bestStreak.d}<small> 일</small>` : '-', holder: bestStreak.name, emoji: '🔁' });

  $('prGrid').innerHTML = items.map(it => `
    <div class="pr-card">
      <div class="pr-emoji">${it.emoji}</div>
      <div class="pr-label">${it.label}</div>
      <div class="pr-value">${it.value}</div>
      <div class="pr-holder">${it.holder ? `보유자 <b class="${userClass(it.holder)}">${it.holder}</b>` : '아직 기록 없음'}</div>
    </div>`).join('');
}

function renderCalendar() {
  $('calMonth').textContent = `${calYear}년 ${calMonth}월`;
  const first = new Date(calYear, calMonth - 1, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(calYear, calMonth, 0).getDate();
  const dateMap = {};
  for (const l of logs) {
    const d = new Date(l.run_date + 'T00:00');
    if (d.getFullYear() === calYear && (d.getMonth() + 1) === calMonth) {
      const k = d.getDate();
      if (!dateMap[k]) dateMap[k] = new Set();
      dateMap[k].add(String(l.user_id));
    }
  }
  const todayD = new Date();
  const isThisMonth = todayD.getFullYear() === calYear && (todayD.getMonth()+1) === calMonth;
  const wkdays = ['일','월','화','수','목','금','토'];
  let html = '<div class="calendar-grid">' + wkdays.map((w, i) =>
    `<div class="cal-weekday" style="color:${i===0?'#e89aa5':i===6?'#9ab8d8':'var(--muted)'}">${w}</div>`).join('');
  for (let i = 0; i < startDay; i++) html += '<div class="cal-day empty"></div>';
  const mhU = getUserByName('미현'), hjU = getUserByName('현주');
  for (let d = 1; d <= daysInMonth; d++) {
    const ids = dateMap[d] ? [...dateMap[d]] : [];
    const filteredIds = calFilter === 'all' ? ids : (ids.includes(calFilter) ? [calFilter] : []);
    const dots = filteredIds.map(id => { const u = getUserById(id); return u ? `<span class="${userClass(u.user_name)}"></span>` : ''; }).join('');
    let bgCls = '';
    if (calFilter === 'all') {
      const hasMh = mhU && ids.includes(String(mhU.user_id));
      const hasHj = hjU && ids.includes(String(hjU.user_id));
      if (hasMh && hasHj) bgCls = ' both';
      else if (hasMh) bgCls = ' mh-only';
      else if (hasHj) bgCls = ' hj-only';
    }
    const todayCls = (isThisMonth && d === todayD.getDate()) ? ' today' : '';
    html += `<div class="cal-day${todayCls}${bgCls}"><span class="num">${d}</span><div class="dots">${dots}</div></div>`;
  }
  html += '</div>';
  $('calendarBody').innerHTML = html;

  const mhDates = new Set(), hjDates = new Set();
  for (const l of logs) {
    const d = new Date(l.run_date + 'T00:00');
    if (d.getFullYear() === calYear && (d.getMonth() + 1) === calMonth) {
      const u = getUserById(l.user_id);
      if (u && u.user_name === '미현') mhDates.add(l.run_date);
      if (u && u.user_name === '현주') hjDates.add(l.run_date);
    }
  }
  let common = 0; for (const d of mhDates) if (hjDates.has(d)) common++;
  const mhKm = userLogs('미현').filter(x => { const d = new Date(x.run_date+'T00:00'); return d.getFullYear()===calYear && (d.getMonth()+1)===calMonth; }).reduce((s,x)=>s+parseFloat(x.distance||0),0);
  const hjKm = userLogs('현주').filter(x => { const d = new Date(x.run_date+'T00:00'); return d.getFullYear()===calYear && (d.getMonth()+1)===calMonth; }).reduce((s,x)=>s+parseFloat(x.distance||0),0);
  $('calSummary').innerHTML = `
    <div>미현 <strong>${mhDates.size}일 · ${mhKm.toFixed(1)}km</strong></div>
    <div>현주 <strong>${hjDates.size}일 · ${hjKm.toFixed(1)}km</strong></div>
    <div>같이 뛴 날 <strong>${common}일</strong></div>
  `;
}

function prevMonth() { calMonth--; if (calMonth < 1) { calMonth = 12; calYear--; } renderCalendar(); }
function nextMonth() { calMonth++; if (calMonth > 12) { calMonth = 1; calYear++; } renderCalendar(); }

function renderFoodTotal() {
  let totalKcal = 0;
  for (const l of logs) {
    const u = getUserById(l.user_id); if (!u) continue;
    totalKcal += calcKcal(parseFloat(l.distance||0), u.user_name);
  }
  if (totalKcal === 0) {
    $('foodCard').innerHTML = `<div style="color:var(--gold-text);font-size:13px">아직 태운 칼로리가 없어요. 첫 러닝을 추가하면 음식이 차곡차곡 쌓여요 🍙</div>`;
    return;
  }
  const foods = [
    { kcal: 100, name: '붕어빵', emoji: '🥖' },
    { kcal: 250, name: '아이스크림', emoji: '🍦' },
    { kcal: 300, name: '치킨 한 조각', emoji: '🍗' },
    { kcal: 500, name: '햄버거', emoji: '🍔' },
    { kcal: 600, name: '라면 한 봉지', emoji: '🍜' },
    { kcal: 700, name: '피자 한 조각', emoji: '🍕' },
    { kcal: 1000, name: '치킨 한 마리', emoji: '🍗' },
  ];
  const grid = foods.map(f => {
    const cnt = Math.floor(totalKcal / f.kcal);
    return `<div class="food-item"><div class="f-emoji">${f.emoji}</div><div class="f-count">${cnt.toLocaleString()}</div><div class="f-name">${f.name}</div></div>`;
  }).join('');
  $('foodCard').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div>
        <div class="food-total-num">${totalKcal.toLocaleString()}<small> kcal 태웠어요</small></div>
        <div style="color:var(--gold-text);font-size:12px;margin-top:4px">두 사람 누적 · 거리 × 몸무게 × 1.036</div>
      </div>
    </div>
    <div class="food-grid">${grid}</div>
  `;
}

function renderFeed() {
  if (!logs.length) {
    $('feed').innerHTML = '<div class="empty-state">아직 기록이 없어요. 오른쪽 아래 ＋ 버튼으로 첫 러닝을 추가해보세요 🏃‍♀️</div>';
    return;
  }
  $('feed').innerHTML = logs.slice(0, 30).map(l => {
    const u = getUserById(l.user_id);
    const name = u ? u.user_name : '?';
    const cls = userClass(name);
    const km = parseFloat(l.distance || 0);
    const sec = parseInt(l.duration_seconds || 0);
    const kcal = calcKcal(km, name);
    return `
      <div class="feed-item">
        <div class="left"><div class="avatar ${cls}">${name[0]}</div></div>
        <div class="body">
          <div class="meta">
            <span class="name">${name}</span>
            <span class="date">${fmtDate(l.run_date)}</span>
            <button class="delete" onclick="deleteLog('${l.id}')">삭제</button>
          </div>
          <div class="stats">
            <div class="stat"><label>거리</label><strong>${km.toFixed(2)}</strong> km</div>
            <div class="stat"><label>시간</label><strong>${fmtDuration(sec)}</strong></div>
            <div class="stat"><label>평균 페이스</label><strong>${paceFromSec(sec, km)}</strong>/km</div>
            <div class="stat"><label>칼로리</label><strong>${kcal}</strong> kcal</div>
          </div>
          ${l.memo ? `<div class="memo">${escapeHtml(l.memo)}</div>` : ''}
          <div class="food">소모량 ≈ ${getFood(kcal)}</div>
          ${l.image_url ? `<div class="photo"><img src="${l.image_url}" onclick="openLightbox('${l.image_url}')" alt="" /></div>` : ''}
        </div>
      </div>`;
  }).join('');
}

// ============== Modal handlers (same as before) ==============
function openModal(id) { $(id).classList.add('show'); }
function closeModal(id) { $(id).classList.remove('show'); }

function renderAddPersonOptions() {
  $('addPerson').innerHTML = NAMES.map(n => {
    const cls = userClass(n) + (n === addPersonName ? ' active' : '');
    return `<button type="button" class="${cls}" onclick="setAddPerson('${n}')">${n}</button>`;
  }).join('');
}
function setAddPerson(n) { addPersonName = n; renderAddPersonOptions(); updateAddPreview(); }

function openAddModal() {
  $('addDate').value = new Date().toISOString().slice(0, 10);
  $('addDistance').value = ''; $('addH').value = ''; $('addM').value = ''; $('addS').value = '';
  $('addMemo').value = ''; $('addPhoto').value = '';
  updateAddPreview();
  openModal('addModal');
}
function updateAddPreview() {
  const km = parseFloat($('addDistance').value) || 0;
  const h = parseInt($('addH').value) || 0, m = parseInt($('addM').value) || 0, s = parseInt($('addS').value) || 0;
  const sec = h*3600 + m*60 + s;
  const kcal = calcKcal(km, addPersonName);
  let html = '';
  if (km && sec) html += `평균 페이스 <strong>${paceFromSec(sec, km)}/km</strong>`;
  if (km) { if (html) html += ' · '; html += `예상 소모 <strong>${kcal} kcal</strong> ≈ ${getFood(kcal)}`; }
  if (!html) html = '거리·시간을 입력하면 페이스 · 칼로리가 자동 계산돼요';
  $('addPreview').innerHTML = html;
}
['addDistance','addH','addM','addS'].forEach(id => {
  document.addEventListener('input', e => { if (e.target && e.target.id === id) updateAddPreview(); });
});

async function submitAdd() {
  const u = getUserByName(addPersonName);
  if (!u) { toast('사용자를 찾을 수 없어요'); return; }
  const date = $('addDate').value;
  const km = parseFloat($('addDistance').value);
  const h = parseInt($('addH').value) || 0, m = parseInt($('addM').value) || 0, s = parseInt($('addS').value) || 0;
  const sec = h*3600 + m*60 + s;
  if (!date) { toast('날짜를 선택해 주세요'); return; }
  if (!km || km <= 0) { toast('거리를 입력해 주세요'); return; }
  if (!sec) { toast('시간을 입력해 주세요'); return; }

  $('addSubmit').disabled = true;
  let imageUrl = null;
  const file = $('addPhoto').files[0];
  if (file) {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${u.user_id}/${Date.now()}.${ext}`;
    const { error: ue } = await sb.storage.from(STORAGE_BUCKET).upload(path, file, { upsert: false });
    if (ue) {
      const ok = confirm(`사진 업로드 실패: ${ue.message}\n\nSupabase Storage에 '${STORAGE_BUCKET}' 버킷이 있는지 확인해 주세요.\n\n사진 없이 저장할까요?`);
      if (!ok) { $('addSubmit').disabled = false; return; }
    } else {
      imageUrl = sb.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
    }
  }

  const { error } = await sb.from('run_log').insert({
    user_id: u.user_id, run_date: date, distance: km, duration_seconds: sec,
    memo: $('addMemo').value || null, image_url: imageUrl
  });
  $('addSubmit').disabled = false;
  if (error) {
    toast('저장 실패: ' + error.message);
    if (error.message.toLowerCase().includes('row-level') || error.message.toLowerCase().includes('policy')) {
      showHelp(`<b>RLS 정책이 막혀있어요.</b> SQL Editor에 아래를 실행해 주세요:<br><code>CREATE POLICY p_log ON run_log FOR ALL TO anon USING (true) WITH CHECK (true);</code>`);
    }
    return;
  }
  toast('기록이 저장됐어요 🏃‍♀️');
  closeModal('addModal');
  await loadAll();
}

async function deleteLog(id) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  const { error } = await sb.from('run_log').delete().eq('id', id);
  if (error) { toast('삭제 실패: ' + error.message); return; }
  toast('삭제됐어요'); await loadAll();
}

function openGoal(userId, name) {
  goalEditingUserId = userId;
  $('goalModalTitle').textContent = `${name} 목표 설정`;
  const ex = goals.find(g => String(g.user_id) === String(userId));
  if (ex) { $('goalType').value = ex.goal_type; $('goalValue').value = ex.target_value; }
  else { $('goalType').value = 'MONTHLY_DISTANCE'; $('goalValue').value = ''; }
  openModal('goalModal');
}

async function submitGoal() {
  const type = $('goalType').value;
  const val = parseFloat($('goalValue').value);
  if (!val || val <= 0) { toast('목표값을 입력해 주세요'); return; }
  const y = today.getFullYear(), m = today.getMonth() + 1;
  await sb.from('run_goal').delete().eq('user_id', goalEditingUserId).eq('goal_year', y).eq('goal_month', m);
  const { error } = await sb.from('run_goal').insert({ user_id: goalEditingUserId, goal_year: y, goal_month: m, goal_type: type, target_value: val });
  if (error) { toast('저장 실패: ' + error.message); return; }
  toast('목표가 저장됐어요!'); closeModal('goalModal'); await loadAll();
}

function openSetup() {
  $('weightMh').value = localStorage.getItem('weight_미현') || '';
  $('weightHj').value = localStorage.getItem('weight_현주') || '';
  openModal('setupModal');
}
function submitWeights() {
  if ($('weightMh').value) setWeight('미현', $('weightMh').value);
  if ($('weightHj').value) setWeight('현주', $('weightHj').value);
  closeModal('setupModal'); renderAll(); toast('저장됐어요');
}

function openLightbox(url) { $('lightboxImg').src = url; $('lightbox').classList.add('show'); }
function closeLightbox() { $('lightbox').classList.remove('show'); }

document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('show'); });
});

loadAll();
</script>
</body>
</html>
